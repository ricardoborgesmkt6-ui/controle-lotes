<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F4FD8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lotes">
<meta name="robots" content="noindex">
<title>Controle de Lotes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F4FD8'/%3E%3Cpath d='M7 22l6-6 4 4 8-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
a.btn{text-decoration:none;color:var(--ink)}
button:disabled{opacity:.55;cursor:default}

/* Layout: painel de operação — faixa de números no topo, gráfico de caixa, depois lista de lotes / histórico. Ações fixas no rodapé no celular. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F9FC; --ink:#131926; --muted:#5A6476; --line:#DCE2EB;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#E6ECFC;
  --pos:#0E865B; --pos-soft:#E2F4EC; --neg:#C5352B; --neg-soft:#FBE8E6; --warn:#A86A12; --warn-soft:#FBF0DC;
  --shadow:0 1px 2px rgba(19,25,38,.06),0 8px 24px rgba(19,25,38,.06);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1118; --surface:#151B25; --surface-2:#1A212D; --ink:#E6EAF2; --muted:#98A2B5; --line:#273041;
  --accent:#7091FF; --accent-ink:#0D1118; --accent-soft:#1C2744;
  --pos:#3CC690; --pos-soft:#14301F; --neg:#FF6E60; --neg-soft:#3A1A17; --warn:#E3AA45; --warn-soft:#352814;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1118; --surface:#151B25; --surface-2:#1A212D; --ink:#E6EAF2; --muted:#98A2B5; --line:#273041;
  --accent:#7091FF; --accent-ink:#0D1118; --accent-soft:#1C2744;
  --pos:#3CC690; --pos-soft:#14301F; --neg:#FF6E60; --neg-soft:#3A1A17; --warn:#E3AA45; --warn-soft:#352814;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 120px;display:flex;flex-direction:column;gap:20px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn svg{width:16px;height:16px}
.desk-only{display:flex}
@media (max-width:720px){.desk-only{display:none}}

/* KPI band */
.band{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:12px}
@media (max-width:900px){.band{grid-template-columns:1fr 1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;overflow-wrap:anywhere}
.kpi .sub{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.kpi.hero{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.hero .lbl,.kpi.hero .sub{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.kpi.hero .val{font-size:30px}
@media (max-width:900px){.kpi.hero{grid-column:1/-1}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-pos{background:var(--pos-soft);color:var(--pos)} .p-neg{background:var(--neg-soft);color:var(--neg)}
.p-warn{background:var(--warn-soft);color:var(--warn)} .p-mut{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.p-acc{background:var(--accent-soft);color:var(--accent)}


@media (max-width:900px){.band .kpi:last-child{grid-column:1/-1}}
@media (max-width:520px){.kpi .val{font-size:18px;white-space:nowrap}.kpi.hero .val{font-size:28px}.kpi{padding:14px}}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.panel-h h2{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.caption{font-size:13px;color:var(--muted)}
.caption b{color:var(--ink);font-weight:600}
#chart{width:100%;height:auto;display:block;touch-action:pan-y}
#chart text{font-family:var(--f-num);font-size:10.5px;fill:var(--muted)}

/* tabs + filters */
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.search{flex:1;min-width:160px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px}

/* lote rows */
.lotes{display:flex;flex-direction:column}
.lote{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) 120px 110px;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.lote:first-child{border-top:0}
.lote:hover{background:var(--surface-2)}
.lote .nm{font-family:var(--f-num);font-weight:600;font-size:15px;overflow-wrap:anywhere}
.lote .meta{font-size:12.5px;color:var(--muted)}
.flow{display:flex;flex-direction:column;gap:6px;min-width:0}
.flow .nums{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.bar i.over{background:var(--pos)}
.bar i.fc{background:repeating-linear-gradient(45deg,var(--warn) 0 4px,transparent 4px 7px);opacity:.7}
.lote .res{text-align:right;font-family:var(--f-num);font-weight:600}
.lote .res small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.lote .st{text-align:right}
@media (max-width:720px){
  .lote{grid-template-columns:minmax(0,1fr) auto;row-gap:8px}
  .lote .flow{grid-column:1/-1;order:3}
  .lote .st{order:2}
  .lote .res{display:none}
}

/* history */
.day{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.day:first-child{border-top:0;margin-top:0;padding-top:0}
.day-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.day-h strong{font-family:var(--f-num);font-size:14px;letter-spacing:.04em}
.day-h span{font-size:12.5px;color:var(--muted)}
.ent{display:grid;grid-template-columns:110px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.ent .who{min-width:0;overflow-wrap:anywhere}
.ent .who b{font-family:var(--f-num);font-weight:600}
.ent .who span{color:var(--muted);font-size:12.5px}
.ent .v{font-family:var(--f-num);font-weight:600;text-align:right;white-space:nowrap}
.ent .ops{display:flex;gap:4px;justify-content:flex-end}
.ent.prev{opacity:.85}
.ent.prev .v{font-style:italic}
@media (max-width:620px){.ent{grid-template-columns:minmax(0,1fr) auto}.ent .tp{grid-column:1/-1}.ent .ops{grid-column:1/-1}}

.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--f-display);color:var(--ink);margin:0 0 6px;font-size:18px}
.empty p{margin:0 auto 14px;max-width:44ch}
.welcome{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
@media (max-width:720px){.welcome{grid-template-columns:1fr}}
.welcome h2{font-family:var(--f-display);font-size:22px;margin:0 0 6px}
.welcome ol{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.notice{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}

/* forms / modal */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:520px;max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
@media (max-width:620px){.overlay{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 18px 6px}
.sheet-h h2{font-family:var(--f-display);font-size:19px;margin:0}
.sheet-b{padding:8px 18px 18px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lab{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field input.num{font-family:var(--f-num)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg label{position:relative;flex:1;text-align:center;padding:8px 6px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.total b{font-family:var(--f-num);font-size:18px;color:var(--accent)}
.err{color:var(--neg);font-size:13px;min-height:1em}
.hint{font-size:12.5px;color:var(--muted)}
details.opt{border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
details.opt summary{cursor:pointer;font-weight:600;font-size:13.5px}
details.opt[open] summary{margin-bottom:10px}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dstats div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.dstats span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.dstats b{font-family:var(--f-num);font-size:15px;overflow-wrap:anywhere}

/* mobile action bar + toast */
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;gap:8px;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbar .btn{flex:1;justify-content:center}
@media (max-width:720px){.mbar{display:flex}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:720px){.toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}}}
/* login */
.auth{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.auth-card h1{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0;letter-spacing:-.02em}
.auth-card p{margin:0}
.auth-card .btn.ghost{align-self:center}
.stack{display:flex;flex-direction:column;gap:14px}
.btn.block{width:100%;justify-content:center;padding-block:12px}
/* usuário e visão */
.userbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:-6px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600;font-size:14px;line-height:1.2}
.who small{display:block;font-size:12px;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;flex:none}
.scope{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.scope select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;color:var(--ink);max-width:260px}
@media (max-width:520px){.scope{width:100%}.scope select{flex:1;max-width:none}}
.opn{font-weight:600;color:var(--accent)}
/* tabela de operadores */
.tblwrap{overflow-x:auto;margin-inline:-4px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl td small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.tbl .r{text-align:right}.tbl .c{text-align:center}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr.off{opacity:.55}
.tbl tfoot td{border-bottom:0;background:var(--surface-2);font-weight:600}
.copy{display:flex;gap:8px}
.copy input,#acc{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;width:100%;resize:none;color:var(--ink)}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.field input[readonly]{opacity:.7}
</style>
</head>
<body>
<section id="auth" class="auth" hidden><div class="auth-card" id="auth-card"></div></section>

<div id="app" hidden>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Controle de Lotes</h1>
      <p id="sub">Abrindo…</p>
    </div>
    <div class="actions">
      <button class="btn primary desk-only" data-act="novo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v10M3 8h10"/></svg>Novo lançamento</button>
      <button class="btn soft desk-only" data-act="lancar">Lançar em lote existente</button>
      <button class="btn" data-act="caixa" data-admin hidden>Caixa</button>
      <button class="btn" data-act="sync" aria-label="Atualizar dados da planilha" title="Atualizar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>Atualizar</button>
      <button class="btn" data-act="config">Ajustes</button>
    </div>
  </header>

  <div class="userbar">
    <div class="who" id="who"></div>
    <label class="scope" data-admin hidden><span>Visão</span><select id="scope" aria-label="Escolher operador"></select></label>
  </div>

  <section class="band" id="band" aria-label="Resumo">
    <div class="kpi hero"><span class="lbl">Saldo em caixa</span><span class="val" id="k-saldo">—</span><span class="sub" id="k-saldo-s"></span></div>
    <div class="kpi"><span class="lbl">Resultado acumulado</span><span class="val" id="k-res">—</span><span class="sub" id="k-res-s"></span></div>
    <div class="kpi"><span class="lbl">Hoje</span><span class="val" id="k-hoje">—</span><span class="sub" id="k-hoje-s"></span></div>
    <div class="kpi"><span class="lbl">A recolher</span><span class="val" id="k-prev">—</span><span class="sub" id="k-prev-s"></span></div>
  </section>

  <section class="panel" id="welcome" hidden></section>

  <section class="panel">
    <div class="panel-h"><h2>Saldo e resultado por dia</h2><span class="caption" id="cap">—</span></div>
    <svg id="chart" viewBox="0 0 760 250" role="img" aria-label="Gráfico do saldo em caixa e do resultado de cada dia"></svg>
  </section>

  <section class="panel">
    <div class="panel-h">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="lotes">Lotes</button>
        <button role="tab" aria-selected="false" data-tab="hist">Histórico</button>
        <button role="tab" aria-selected="false" data-tab="ops" data-admin hidden>Operadores</button>
      </div>
      <span class="caption" id="list-cap"></span>
    </div>
    <div id="view-lotes">
      <div class="toolbar">
        <div class="chips" id="chips">
          <button class="chip" data-f="todos" aria-pressed="true">Todos</button>
          <button class="chip" data-f="aberto" aria-pressed="false">Em aberto</button>
          <button class="chip" data-f="lucro" aria-pressed="false">Com lucro</button>
          <button class="chip" data-f="prej" aria-pressed="false">Com prejuízo</button>
        </div>
        <input class="search" id="q" type="search" placeholder="Buscar lote" autocomplete="off">
      </div>
      <div class="lotes" id="lotes"></div>
    </div>
    <div id="view-hist" hidden><div id="hist"></div></div>
    <div id="view-ops" hidden><div id="ops"></div></div>
  </section>
</div>
</div>

<nav class="mbar" hidden>
  <button class="btn primary" data-act="novo">Novo lançamento</button>
  <button class="btn soft" data-act="lancar">Lote existente</button>
</nav>

<div id="modal-root"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(() => {
const MES=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money=v=>BRL.format(v||0).replace(/ /g," ");
const signed=v=>(v>0?"+":v<0?"−":"")+money(Math.abs(v));
const pct=v=>(v>0?"+":v<0?"−":"")+Math.abs(v*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";
const cls=v=>v>0?"pos":v<0?"neg":"";
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(iso,n){const [y,m,d]=iso.split("-").map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function dayLbl(iso,withYear){if(!iso)return"—";const [y,m,d]=iso.split("-");const cur=String(new Date().getFullYear());return d+" "+MES[+m-1]+((withYear||y!==cur)?" "+y.slice(2):"")}
function parseMoney(s){s=String(s??"").replace(/[R$\s]/g,"");if(!s)return NaN;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");return Number(s)}
function parseInt0(s){return Number(String(s??"").replace(/\D/g,""))}
function hhmm(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
const moneyIn=v=>v==null||v===""?"":String(v).replace(".",",");

/* ---------- conexão e sessão ---------- */
const store={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}},del(k){try{localStorage.removeItem(k)}catch(_){}}};
(function lerLinkDeAcesso(){try{const u=new URL(location.href);const api=u.searchParams.get("api");if(api&&/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(api)){store.set("cl_url",api);u.searchParams.delete("api");history.replaceState(null,"",u.pathname+(u.search||"")+u.hash)}}catch(_){}})();
store.del("cl_chave"); // versão antiga guardava a chave
const CONN={url:store.get("cl_url")||"",token:store.get("cl_token")||""};
const S={me:null,users:new Map(),lotes:new Map(),lanc:new Map(),loaded:false,view:store.get("cl_view")||"todos",tab:"lotes",filter:"todos",q:"",planilha:"",busy:false,syncedAt:null,temAdmin:null,authMode:"login",authMsg:""};
const isAdmin=()=>S.me?.papel==="admin";

async function api(acao,dados){
  if(!CONN.url)throw new Error("Falta o link do app da planilha.");
  let r;
  try{r=await fetch(CONN.url,{method:"POST",body:JSON.stringify({acao,dados:dados||{},token:CONN.token})})}
  catch(_){throw new Error("Sem conexão com a planilha. Verifique a internet e o link do app.")}
  let j;try{j=await r.json()}catch(_){throw new Error("A planilha respondeu de um jeito inesperado. Confira se o link termina em /exec e se o acesso do app está como “Anyone”.")}
  if(!j.ok){const e=new Error(j.erro||"Erro na planilha.");e.codigo=j.codigo;if(j.codigo==="sessao")sair(j.erro);throw e}
  if(j.token){CONN.token=j.token;store.set("cl_token",j.token)}
  if(j.dados)applyData(j.dados);
  return j;
}
function applyData(d){
  S.me=d.eu;
  S.users=new Map((d.usuarios||[]).map(u=>[u.id,u]));
  S.lotes=new Map((d.lotes||[]).map(l=>[l.id,l]));
  S.lanc=new Map((d.lanc||[]).map(e=>[e.id,e]));
  S.planilha=d.planilha||"";S.loaded=true;S.syncedAt=hhmm();
  if(!isAdmin())S.view=S.me.id;else if(S.view!=="todos"&&!S.users.has(S.view))S.view="todos";
  render();
}
function sair(msg){
  CONN.token="";store.del("cl_token");S.loaded=false;S.me=null;S.users=new Map();S.lotes=new Map();S.lanc=new Map();
  S.authMode="login";S.authMsg=msg||"";S.temAdmin=true;closeModal();render();
}
async function refresh(silent){
  if(!CONN.url||!CONN.token||S.busy)return;
  try{await api("listar")}catch(e){if(!silent&&e.codigo!=="sessao")toast(e.message)}
}

/* ---------- toast ---------- */
let tT;function toast(msg,ms){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,ms||2800)}

/* ---------- cálculo ---------- */
const opName=id=>S.users.get(id)?.nome||(id?"(sem operador)":"—");
function compute(scope){
  scope=scope||S.view;
  const inScope=x=>scope==="todos"||x.op===scope;
  const lots=new Map();
  for(const [id,l] of S.lotes) if(inScope(l)) lots.set(id,{...l,id,inv:0,rec:0,prev:0,rodadas:0,ops:0,last:l.data,ents:[]});
  const us=[...S.users.values()].filter(u=>scope==="todos"||u.id===scope);
  const inicios=us.map(u=>u.inicio).filter(Boolean).sort();
  const T={capital:us.reduce((s,u)=>s+(Number(u.capital)||0),0),inicio:inicios[0]||null,inv:0,rec:0,prev:0,ap:0,ret:0,last:null,count:0};
  const byDay=new Map();
  const day=d=>{if(!byDay.has(d))byDay.set(d,{inv:0,rec:0,ap:0,ret:0,prev:0,lotes:0});return byDay.get(d)};
  for(const [id,e] of S.lanc){
    if(!inScope(e))continue;
    T.count++;if(!T.last||e.data>T.last)T.last=e.data;
    const v=Number(e.valor)||0, real=e.status!=="previsto", L=lots.get(e.loteId);
    if(L){L.ents.push({...e,id});if(e.data>L.last)L.last=e.data}
    if(e.tipo==="investimento"){T.inv+=v;day(e.data).inv+=v;if(L){L.inv+=v;L.rodadas++;L.ops+=Number(e.qtd)||0}}
    else if(e.tipo==="recolhimento"){ if(real){T.rec+=v;day(e.data).rec+=v;if(L)L.rec+=v} else {T.prev+=v;day(e.data).prev+=v;if(L)L.prev+=v} }
    else if(e.tipo==="aporte"&&real){T.ap+=v;day(e.data).ap+=v}
    else if(e.tipo==="retirada"&&real){T.ret+=v;day(e.data).ret+=v}
  }
  for(const L of lots.values()){
    L.res=L.rec-L.inv; L.roi=L.inv?L.res/L.inv:0;
    L.st=L.prev>0?"recolher":L.rec===0?"aguardando":L.res>=0?"lucro":"prejuizo";
    L.ents.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:(a.createdAt||0)-(b.createdAt||0));
    if(L.data) day(L.data).lotes++;
  }
  T.res=T.rec-T.inv; T.roi=T.inv?T.res/T.inv:0; T.saldo=T.capital+T.ap-T.ret-T.inv+T.rec;
  T.abertos=[...lots.values()].filter(l=>l.st==="recolher"||l.st==="aguardando").length;
  const dates=[...byDay.keys()].sort(); const today=todayISO();
  let start=T.inicio||dates[0]||null; if(dates[0]&&start&&dates[0]<start)start=dates[0];
  const series=[];
  if(start){
    let end=today; const realDates=dates.filter(d=>{const x=byDay.get(d);return x.inv||x.rec||x.ap||x.ret}); if(realDates.length&&realDates[realDates.length-1]>end)end=realDates[realDates.length-1];
    let saldo=T.capital, d=start, guard=0;
    while(d<=end&&guard<4000){const x=byDay.get(d)||{inv:0,rec:0,ap:0,ret:0,prev:0,lotes:0};saldo+=x.ap-x.ret-x.inv+x.rec;series.push({d,res:x.rec-x.inv,saldo,...x});d=addDays(d,1);guard++}
  }
  return {lots,T,byDay,series,today};
}

/* ---------- render ---------- */
const ST={recolher:["A recolher","p-warn"],aguardando:["Aguardando","p-mut"],lucro:["Lucro","p-pos"],prejuizo:["Prejuízo","p-neg"]};
function render(){
  const logged=!!(S.me&&S.loaded);
  $("#auth").hidden=logged; $("#app").hidden=!logged; document.querySelector(".mbar").hidden=!logged;
  if(!logged){renderAuth();return}
  const admin=isAdmin();
  document.querySelectorAll("[data-admin]").forEach(el=>el.hidden=!admin);
  const C=compute(); S.C=C;
  const {T,lots,today}=C;
  const scopeName=S.view==="todos"?"todos os operadores":opName(S.view);
  $("#sub").textContent=`${admin?"Visão: "+scopeName+" · ":""}${lots.size} ${lots.size===1?"lote":"lotes"} · atualizado às ${S.syncedAt}`;
  $("#who").innerHTML=`<span class="avatar" aria-hidden="true">${esc((S.me.nome||"?").trim().charAt(0).toUpperCase())}</span><span><b>${esc(S.me.nome)}</b><small>${admin?"Administrador":"Operador"}</small></span>`;
  if(admin){
    const sel=$("#scope");const opts=[["todos","Todos os operadores"],...[...S.users.values()].sort((a,b)=>a.papel===b.papel?a.nome.localeCompare(b.nome):a.papel==="admin"?-1:1).map(u=>[u.id,u.nome+(u.id===S.me.id?" (você)":"")+(u.ativo?"":" · inativo")])];
    sel.innerHTML=opts.map(([v,l])=>`<option value="${esc(v)}" ${v===S.view?"selected":""}>${esc(l)}</option>`).join("");
  }
  $("#k-saldo").textContent=money(T.saldo);
  $("#k-saldo-s").innerHTML=`Capital ${money(T.capital)}${T.ap?` · aportes ${money(T.ap)}`:""}${T.ret?` · retiradas ${money(T.ret)}`:""}`;
  const kr=$("#k-res");kr.textContent=signed(T.res);kr.className="val "+cls(T.res);
  $("#k-res-s").innerHTML=`<span class="num ${cls(T.roi)}">${pct(T.roi)}</span><span>investido ${money(T.inv)}</span><span>recolhido ${money(T.rec)}</span>`;
  const td=C.byDay.get(today)||{inv:0,rec:0,lotes:0};const hr=td.rec-td.inv;
  const kh=$("#k-hoje");kh.textContent=signed(hr);kh.className="val "+cls(hr);
  $("#k-hoje-s").innerHTML=`<span>${td.lotes} ${td.lotes===1?"lote novo":"lotes novos"}</span><span>inv. ${money(td.inv)}</span><span>rec. ${money(td.rec)}</span>`;
  $("#k-prev").textContent=money(T.prev);
  $("#k-prev-s").innerHTML=`<span>${T.abertos} ${T.abertos===1?"lote em aberto":"lotes em aberto"}</span><span>projetado ${money(T.saldo+T.prev)}</span>`;
  if(!admin&&S.tab==="ops")S.tab="lotes";
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===S.tab)));
  $("#view-lotes").hidden=S.tab!=="lotes";$("#view-hist").hidden=S.tab!=="hist";$("#view-ops").hidden=S.tab!=="ops";
  renderWelcome(C);renderChart(C.series);renderLotes(C);renderHist(C);if(admin)renderOps();
}

function renderAuth(){
  const box=$("#auth-card");
  if(!CONN.url){box.innerHTML=`<h1>Controle de Lotes</h1><p class="muted">Este aparelho ainda não sabe onde está a planilha. Abra o <b>link de acesso</b> que o administrador enviou. Se você é o administrador, cole abaixo o link do app da Web (termina em /exec).</p>
    <form id="fa-url" novalidate class="stack"><div class="field"><label for="a-url">Link do app da Web</label><input id="a-url" class="num" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></div><div class="err" id="a-err"></div><button class="btn primary block" type="submit">Continuar</button></form>`;return}
  if(S.temAdmin===null){box.innerHTML=`<h1>Controle de Lotes</h1><p class="muted">Conectando à planilha…</p>`;return}
  if(S.temAdmin===false){box.innerHTML=`<h1>Criar administrador</h1><p class="muted">Primeiro acesso. Crie o seu login de administrador. A chave é a que a planilha mostrou em “Preparar planilha” (menu Controle de Lotes → Mostrar chave de acesso).</p>
    <form id="fa-admin" novalidate class="stack">
      <div class="field"><label for="a-nome">Seu nome</label><input id="a-nome" autocomplete="name"></div>
      <div class="field"><label for="a-user">Usuário (login)</label><input id="a-user" class="num" autocomplete="username" autocapitalize="none" placeholder="ex.: ricardo"></div>
      <div class="row2"><div class="field"><label for="a-pass">Senha</label><input id="a-pass" type="password" autocomplete="new-password"></div><div class="field"><label for="a-pass2">Repita a senha</label><input id="a-pass2" type="password" autocomplete="new-password"></div></div>
      <div class="field"><label for="a-chave">Chave da planilha</label><input id="a-chave" class="num" autocomplete="off"></div>
      <div class="err" id="a-err"></div><button class="btn primary block" type="submit">Criar e entrar</button></form>
    <button class="btn ghost small" data-act="trocarlink">Usar outro link de planilha</button>`;return}
  box.innerHTML=`<h1>Entrar</h1><p class="muted">Controle de Lotes</p>${S.authMsg?`<div class="notice">${esc(S.authMsg)}</div>`:""}
    <form id="fa-login" novalidate class="stack">
      <div class="field"><label for="a-user">Usuário</label><input id="a-user" class="num" autocomplete="username" autocapitalize="none"></div>
      <div class="field"><label for="a-pass">Senha</label><input id="a-pass" type="password" autocomplete="current-password"></div>
      <div class="err" id="a-err"></div><button class="btn primary block" type="submit">Entrar</button></form>
    <p class="hint">Esqueceu a senha? Peça ao administrador para redefinir.</p>
    <button class="btn ghost small" data-act="trocarlink">Usar outro link de planilha</button>`;
}
async function checarStatus(){
  if(!CONN.url)return render();
  S.temAdmin=null;render();
  try{const r=await fetch(CONN.url,{method:"POST",body:JSON.stringify({acao:"status"})});const j=await r.json();if(!j.ok)throw new Error(j.erro);S.temAdmin=!!j.temAdmin}
  catch(e){S.temAdmin=true;S.authMsg="Não consegui falar com a planilha. Confira a internet e o link do app."}
  render();
}

function renderWelcome(C){
  const w=$("#welcome");
  if(isAdmin()){
    if(S.users.size>1){w.hidden=true;return}
    w.hidden=false;
    w.innerHTML=`<div class="welcome"><div><h2>Cadastre seus operadores</h2><p class="muted" style="margin:0">Cada operador recebe usuário e senha, tem caixa próprio e vê só os lançamentos dele. Você vê todos, um por um ou somados.</p>
      <ol><li>Defina o seu capital em Operadores → você → Editar</li><li>Crie um operador com usuário, senha e capital</li><li>Envie para ele o link de acesso e o login</li></ol></div>
      <div class="actions"><button class="btn primary" data-act="novoop">Novo operador</button><button class="btn" data-act="linkacesso">Link de acesso</button></div></div>`;return}
  if(C.lots.size){w.hidden=true;return}
  w.hidden=false;
  w.innerHTML=`<div class="welcome"><div><h2>Olá, ${esc(S.me.nome.split(" ")[0])}</h2><p class="muted" style="margin:0">Seu capital inicial é ${money(C.T.capital)}. Crie o seu primeiro lote com o nome que quiser; os recolhimentos você lança depois, escolhendo o lote.</p></div>
    <div><button class="btn primary" data-act="novo">Criar primeiro lote</button></div></div>`;
}

function renderLotes(C){
  const box=$("#lotes");
  let arr=[...C.lots.values()];
  const total=arr.length,showOp=isAdmin()&&S.view==="todos";
  const f=S.filter,q=S.q.trim().toLowerCase();
  arr=arr.filter(l=>(f==="todos")||(f==="aberto"&&(l.st==="recolher"||l.st==="aguardando"))||(f==="lucro"&&l.rec>0&&l.res>0)||(f==="prej"&&l.rec>0&&l.res<0));
  if(q)arr=arr.filter(l=>String(l.nome).toLowerCase().includes(q)||(showOp&&opName(l.op).toLowerCase().includes(q)));
  arr.sort((a,b)=>a.last<b.last?1:a.last>b.last?-1:(b.createdAt||0)-(a.createdAt||0));
  if(S.tab==="lotes")$("#list-cap").textContent=`${arr.length} de ${total}`;
  if(!total){box.innerHTML=`<div class="empty"><h3>Nenhum lote ainda</h3><p>Use “Novo lançamento” para criar um lote com o nome que você escolher.</p><button class="btn primary" data-act="novo">Novo lançamento</button></div>`;return}
  if(!arr.length){box.innerHTML=`<div class="empty">Nenhum lote nesse filtro.</div>`;return}
  box.innerHTML=arr.map(l=>{
    const max=Math.max(l.inv,l.rec+l.prev,1);
    const wr=Math.min(100,l.rec/max*100), wp=Math.min(100-wr,l.prev/max*100), winv=l.inv/max*100;
    const [stl,stc]=ST[l.st];
    return `<button class="lote" data-lote="${esc(l.id)}">
      <div style="min-width:0"><div class="nm">${esc(l.nome)}</div>
        <div class="meta">${showOp?`<span class="opn">${esc(opName(l.op))}</span> · `:""}${dayLbl(l.data)} · ${l.rodadas} ${l.rodadas===1?"rodada":"rodadas"}${l.ops?` · ${l.ops.toLocaleString("pt-BR")} op.`:""}</div></div>
      <div class="flow"><div class="nums"><span class="muted">Investido <span class="num" style="color:var(--ink)">${money(l.inv)}</span></span><span class="muted">Recolhido <span class="num" style="color:var(--ink)">${money(l.rec)}</span></span></div>
        <div class="bar" title="Recolhido em relação ao investido"><i class="${l.rec>=l.inv&&l.inv>0?"over":""}" style="width:${wr}%"></i>${wp?`<i class="fc" style="left:${wr}%;width:${wp}%"></i>`:""}${l.rec+l.prev>l.inv?`<span style="position:absolute;top:-2px;bottom:-2px;left:${winv}%;width:2px;background:var(--ink)"></span>`:""}</div></div>
      <div class="res ${cls(l.res)}">${l.rec?signed(l.res):"—"}<small>${l.rec?pct(l.roi):"sem retorno"}</small></div>
      <div class="st"><span class="pill ${stc}">${stl}</span></div></button>`}).join("");
}

const TP={investimento:["Investimento","p-acc"],recolhimento:["Recolhimento","p-pos"],aporte:["Aporte","p-mut"],retirada:["Retirada","p-neg"]};
function entRow(e,showLote){
  const L=S.lotes.get(e.loteId);const prev=e.status==="previsto";const admin=isAdmin();const showOp=admin&&S.view==="todos";
  const [tl,tc]=prev?["Previsto","p-warn"]:TP[e.tipo]||["?","p-mut"];
  const sign=(e.tipo==="investimento"||e.tipo==="retirada")?-1:1;
  const det=e.tipo==="investimento"?(e.qtd&&e.valorOp?`${Number(e.qtd).toLocaleString("pt-BR")} × ${money(e.valorOp)}`:"valor total"):e.tipo==="recolhimento"?(prev?"recolhimento previsto":"recolhimento"):(e.obs||"");
  return `<div class="ent ${prev?"prev":""}">
    <span class="tp"><span class="pill ${tc}">${tl}</span></span>
    <div class="who">${showLote?(L?`<b>${esc(L.nome)}</b> `:(e.loteId?`<b class="muted">lote excluído</b> `:"<b>Caixa</b> ")):`<b class="num">${dayLbl(e.data)}</b> `}<span>${showOp?`<span class="opn">${esc(opName(e.op))}</span> · `:""}${esc(det)}${e.obs&&e.tipo!=="aporte"&&e.tipo!=="retirada"?" · "+esc(e.obs):""}</span></div>
    <span class="v ${prev?"":sign>0?"pos":"neg"}">${prev?"":sign>0?"+":"−"}${money(e.valor)}</span>
    <span class="ops">${prev?`<button class="btn small soft" data-act="receber" data-id="${esc(e.id)}">Recebido</button>`:""}${admin?`<button class="btn small ghost" data-act="del" data-id="${esc(e.id)}">Excluir</button>`:""}</span></div>`;
}
function renderHist(C){
  const box=$("#hist");
  const all=[...S.lanc.values()].filter(e=>S.view==="todos"||e.op===S.view);
  if(S.tab==="hist")$("#list-cap").textContent=`${all.length} lançamentos`;
  if(!all.length){box.innerHTML=`<div class="empty"><h3>Sem lançamentos</h3><p>Tudo o que for lançado aparece aqui, dia a dia.</p></div>`;return}
  const g=new Map();for(const e of all){if(!g.has(e.data))g.set(e.data,[]);g.get(e.data).push(e)}
  const days=[...g.keys()].sort().reverse();
  box.innerHTML=days.map(d=>{const es=g.get(d).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));const x=C.byDay.get(d)||{inv:0,rec:0};const r=x.rec-x.inv;
    return `<div class="day"><div class="day-h"><strong>${dayLbl(d,true)}</strong><span>investido ${money(x.inv)} · recolhido ${money(x.rec)} · <b class="num ${cls(r)}">${signed(r)}</b></span></div>${es.map(e=>entRow(e,true)).join("")}</div>`}).join("");
}

function renderOps(){
  const box=$("#ops");
  const users=[...S.users.values()].sort((a,b)=>a.papel===b.papel?a.nome.localeCompare(b.nome):a.papel==="admin"?-1:1);
  if(S.tab==="ops")$("#list-cap").textContent=`${users.filter(u=>u.ativo).length} ativos`;
  const rows=users.map(u=>({u,T:compute(u.id).T}));
  const tot=compute("todos").T;
  box.innerHTML=`<div class="toolbar"><button class="btn primary small" data-act="novoop">+ Novo operador</button><button class="btn small" data-act="linkacesso">Link de acesso</button><span class="hint">Toque num operador para ver o painel dele.</span></div>

/* ---------- gráfico ---------- */
let CH=null;
function compact(v){const a=Math.abs(v);const s=v<0?"−":"";if(a>=1e6)return s+"R$ "+(a/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi";if(a>=1e3)return s+"R$ "+(a/1e3).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil";return s+"R$ "+Math.round(a)}
function renderChart(series){
  const svg=$("#chart");const cw=svg.getBoundingClientRect().width||760;const W=Math.round(Math.max(330,Math.min(760,cw))),H=250,L=84,R=12,T1=14,H1=130,G=22,H2=60;svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const data=series.slice(-45);CH={data,L,R,W};
  if(!data.length){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" style="font-family:var(--f-body);font-size:13px">O gráfico aparece quando houver o primeiro lançamento.</text>`;$("#cap").textContent="Sem dados ainda";return}
  const n=data.length,iw=W-L-R,step=iw/Math.max(n,1),x=i=>L+step*(i+.5);
  let mn=Math.min(...data.map(p=>p.saldo)),mx=Math.max(...data.map(p=>p.saldo));if(mn===mx){mn-=Math.max(1,Math.abs(mn)*.1);mx+=Math.max(1,Math.abs(mx)*.1)}
  const pad=(mx-mn)*.12;mn-=pad;mx+=pad;const y1=v=>T1+H1-(v-mn)/(mx-mn)*H1;
  const am=Math.max(1,...data.map(p=>Math.abs(p.res)));const z=T1+H1+G+H2/2;const y2=v=>z-v/am*(H2/2);
  const line=data.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y1(p.saldo).toFixed(1)).join(" ");
  const area=line+` L${x(n-1).toFixed(1)} ${T1+H1} L${x(0).toFixed(1)} ${T1+H1} Z`;
  const grid=[0,.5,1].map(t=>{const v=mn+(mx-mn)*(1-t);const yy=T1+H1*t;return `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="${t===1?"0":"3 4"}"/><text x="${L-8}" y="${yy+3.5}" text-anchor="end">${compact(v)}</text>`}).join("");
  const bw=Math.max(2,Math.min(14,step*.62));
  const bars=data.map((p,i)=>p.res?`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${Math.min(z,y2(p.res)).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,Math.abs(y2(p.res)-z)).toFixed(1)}" rx="2" fill="${p.res>0?"var(--pos)":"var(--neg)"}"/>`:"").join("");
  const idx=(n>=7?[0,Math.floor((n-1)/2),n-1]:[0,n-1]).filter((v,i,a)=>a.indexOf(v)===i);
  const xl=idx.map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="${n===1?"middle":i===0?"start":i===n-1?"end":"middle"}">${dayLbl(data[i].d)}</text>`).join("");
  const last=data[n-1];
  svg.innerHTML=`<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
   ${grid}<path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
   <circle cx="${x(n-1)}" cy="${y1(last.saldo)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
   <text x="${L-8}" y="${z+3.5}" text-anchor="end">0</text><line x1="${L}" x2="${W-R}" y1="${z}" y2="${z}" stroke="var(--line)"/>
   <text x="${L-8}" y="${T1+H1+G-6}" text-anchor="end" style="font-family:var(--f-body);font-size:9px;letter-spacing:.06em">RESULTADO</text>
   ${bars}${xl}<line id="guide" x1="0" x2="0" y1="${T1}" y2="${T1+H1+G+H2}" stroke="var(--muted)" stroke-dasharray="2 3" visibility="hidden"/>`;
  setCap(n-1);
}
function setCap(i){const p=CH?.data[i];if(!p)return;$("#cap").innerHTML=`<b class="num">${dayLbl(p.d,true)}</b> · saldo <b class="num">${money(p.saldo)}</b> · dia <b class="num ${cls(p.res)}">${signed(p.res)}</b>`}
$("#chart").addEventListener("pointermove",ev=>{if(!CH||!CH.data.length)return;const svg=ev.currentTarget,r=svg.getBoundingClientRect();const vx=(ev.clientX-r.left)/r.width*CH.W;const step=(CH.W-CH.L-CH.R)/CH.data.length;let i=Math.floor((vx-CH.L)/step);i=Math.max(0,Math.min(CH.data.length-1,i));const g=svg.querySelector("#guide");const gx=CH.L+step*(i+.5);g.setAttribute("x1",gx);g.setAttribute("x2",gx);g.setAttribute("visibility","visible");setCap(i)});
let rT;window.addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(()=>{if(S.C)renderChart(S.C.series)},150)});
$("#chart").addEventListener("pointerleave",()=>{const g=$("#guide");if(g)g.setAttribute("visibility","hidden");if(CH)setCap(CH.data.length-1)});

function modal(title,body,onMount){

  onMount&&onMount(root);
  const f=root.querySelector("input:not([type=radio]):not([type=hidden]):not([readonly]),select");f&&setTimeout(()=>f.focus(),30);
}
function closeModal(){$("#modal-root").innerHTML=""}
function invFields(prefix){return `
  <div class="seg" role="radiogroup" aria-label="Como informar o valor">
    <label><input type="radio" name="${prefix}-modo" value="ops" checked>Qtd × valor</label>
    <label><input type="radio" name="${prefix}-modo" value="tot">Valor total</label></div>
  <div class="row2" data-modo="ops"><div class="field"><label for="${prefix}-qtd">Qtd de operações</label><input id="${prefix}-qtd" class="num" inputmode="numeric" placeholder="20"></div>
    <div class="field"><label for="${prefix}-vop">Valor por operação</label><input id="${prefix}-vop" class="num" inputmode="decimal" placeholder="20,00"></div></div>
  <div class="field" data-modo="tot" hidden><label for="${prefix}-tot">Valor total investido</label><input id="${prefix}-tot" class="num" inputmode="decimal" placeholder="3.030,00"></div>
  <div class="total"><span>Total investido</span><b id="${prefix}-sum">${money(0)}</b></div>`}
function wireInv(root,prefix){
  const upd=()=>{const m=root.querySelector(`input[name=${prefix}-modo]:checked`).value;root.querySelectorAll("[data-modo]").forEach(el=>el.hidden=el.dataset.modo!==m);root.querySelector(`#${prefix}-sum`).textContent=money(readInv(root,prefix).valor||0)};
  root.querySelectorAll(`input[name=${prefix}-modo],#${prefix}-qtd,#${prefix}-vop,#${prefix}-tot`).forEach(el=>el.addEventListener("input",upd));upd();
}
function readInv(root,prefix){const m=root.querySelector(`input[name=${prefix}-modo]:checked`).value;
  if(m==="tot"){const t=parseMoney(root.querySelector(`#${prefix}-tot`).value);return {modo:m,valor:t>0?t:NaN,qtd:null,valorOp:null}}
  const q=parseInt0(root.querySelector(`#${prefix}-qtd`).value),v=parseMoney(root.querySelector(`#${prefix}-vop`).value);return {modo:m,qtd:q,valorOp:v,valor:q>0&&v>0?Math.round(q*v*100)/100:NaN}}
function dateField(id,label,val){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="date" value="${val||todayISO()}"></div>`}
function opSelect(id,label,sel){
  const us=[...S.users.values()].filter(u=>u.ativo).sort((a,b)=>a.id===S.me.id?-1:b.id===S.me.id?1:a.nome.localeCompare(b.nome));

const defaultOp=()=>S.view!=="todos"&&S.users.get(S.view)?.ativo?S.view:S.me.id;
function nameTaken(nome,op){const k=nome.trim().toLowerCase();for(const l of S.lotes.values())if(l.op===op&&String(l.nome).trim().toLowerCase()===k)return true;return false}

async function write(acao,dados,okMsg,btn){
  if(S.busy)return false;
  S.busy=true;let label;if(btn){label=btn.textContent;btn.disabled=true;btn.textContent="Salvando…"}else toast("Salvando na planilha…",8000);
  try{await api(acao,dados);if(okMsg)toast(okMsg);return true}
  catch(e){toast(e.message,4500);return false}
  finally{S.busy=false;if(btn&&btn.isConnected){btn.disabled=false;btn.textContent=label}}

    if(!(cap>=0))return err.textContent="Capital inválido.";
    const dados={id:u?.id,nome,capital:cap,inicio:root.querySelector("#o-ini").value,papel:self?"admin":root.querySelector("#o-papel").value};
    if(u){dados.ativo=self?true:root.querySelector("#o-ativo").value==="1";if(senha)dados.novaSenha=senha}else{dados.usuario=usuario;dados.senha=senha}
    const ok=await write("salvarUsuario",dados,u?"Dados salvos":`${nome} cadastrado`,root.querySelector("button[type=submit]"));
    if(ok){closeModal();if(!u)openAcessoOperador(nome,usuario,senha)}}));
}
const linkAcesso=()=>location.origin+location.pathname+"?api="+encodeURIComponent(CONN.url);
function copyBox(id,val){return `<div class="copy"><input id="${id}" class="num" readonly value="${esc(val)}"><button type="button" class="btn small" data-copy="${id}">Copiar</button></div>`}
function openLinkAcesso(){modal("Link de acesso",`<p class="muted" style="margin:0">Envie este link para os operadores. Ao abrir, o painel já sabe onde está a planilha; eles só precisam do usuário e da senha.</p>${copyBox("lk",linkAcesso())}<span class="hint">O link não dá acesso sozinho: sem usuário e senha, ninguém vê nada.</span>`)}
function openAcessoOperador(nome,usuario,senha){
  const txt=`Acesso ao Controle de Lotes\n${linkAcesso()}\nUsuário: ${usuario}\nSenha: ${senha}`;
  modal("Acesso de "+nome,`<p class="muted" style="margin:0">Envie esta mensagem para ${esc(nome.split(" ")[0])}. Por segurança, peça para trocar a senha no primeiro acesso (Ajustes → Trocar senha).</p>
    <textarea id="acc" class="num" readonly rows="4">${esc(txt)}</textarea><div class="sheet-f"><button type="button" class="btn primary" data-copy="acc">Copiar mensagem</button></div>`)}

function openConfig(){
  const admin=isAdmin();
  modal("Ajustes",`<div class="field"><span class="lab">Minha conta</span><span>${esc(S.me.nome)} · <span class="num">${esc(S.me.usuario)}</span> · ${admin?"Administrador":"Operador"}</span></div>
    <form id="fs" novalidate class="stack" style="gap:10px"><div class="row2"><div class="field"><label for="s-atual">Senha atual</label><input id="s-atual" type="password" autocomplete="current-password"></div><div class="field"><label for="s-nova">Nova senha</label><input id="s-nova" type="password" autocomplete="new-password"></div></div>
    <div class="err" id="s-err"></div><div class="sheet-f"><button class="btn" type="submit">Trocar senha</button></div></form>
    <hr class="sep">
    <div class="sheet-f" style="justify-content:flex-start">
      ${admin&&S.planilha?`<a class="btn" href="${esc(S.planilha)}" target="_blank" rel="noopener">Abrir planilha</a>`:""}
      ${admin?`<button type="button" class="btn" data-act="linkacesso">Link de acesso</button>`:""}
      <button type="button" class="btn" data-act="export">Exportar CSV</button>
      <button type="button" class="btn danger" data-act="sair">Sair</button></div>`,
  root=>root.querySelector("#fs").addEventListener("submit",async ev=>{ev.preventDefault();
    const atual=root.querySelector("#s-atual").value,nova=root.querySelector("#s-nova").value,err=root.querySelector("#s-err");
    if(!atual)return err.textContent="Digite a senha atual.";if(nova.length<6)return err.textContent="A nova senha precisa ter pelo menos 6 caracteres.";
    if(await write("trocarSenha",{atual,nova},"Senha trocada",ev.currentTarget.querySelector("button[type=submit]")))closeModal()}));
}

function openLote(id){
  const L=S.C?.lots.get(id);if(!L)return closeModal();const [stl,stc]=ST[L.st];const admin=isAdmin();
  modal(L.nome,`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill ${stc}">${stl}</span><span class="muted" style="font-size:13px">${admin?esc(opName(L.op))+" · ":""}Criado em ${dayLbl(L.data,true)} · ${L.rodadas} ${L.rodadas===1?"rodada":"rodadas"}${L.ops?` · ${L.ops.toLocaleString("pt-BR")} operações`:""}</span></div>
    <div class="dstats"><div><span>Investido</span><b>${money(L.inv)}</b></div><div><span>Recolhido</span><b>${money(L.rec)}</b></div><div><span>Resultado</span><b class="${cls(L.res)}">${signed(L.res)}</b></div></div>
    ${L.prev?`<div class="notice">Ainda a recolher: <b class="num">${money(L.prev)}</b></div>`:""}
    ${L.obs?`<p class="muted" style="margin:0">${esc(L.obs)}</p>`:""}
    <div>${L.ents.map(e=>entRow(e,false)).join("")||`<p class="muted">Sem lançamentos.</p>`}</div>
    <div class="sheet-f" style="justify-content:space-between">${admin?`<button class="btn small danger" data-act="dellote" data-id="${esc(id)}">Excluir lote</button>`:"<span></span>"}<button class="btn primary" data-act="lancar" data-id="${esc(id)}">Lançar neste lote</button></div>`);
}

/* ---------- ações ---------- */
const armed=new Map();
function arm(btn,key,label,fn){if(armed.get(key)){armed.delete(key);fn();return}armed.set(key,1);const old=btn.textContent;btn.textContent=label;btn.classList.add("danger");setTimeout(()=>{armed.delete(key);if(btn.isConnected){btn.textContent=old;btn.classList.remove("danger")}},3500)}
function exportCSV(){
  const n=v=>v==null||v===""?"":String(Math.round(Number(v)*100)/100).replace(".",",");
  const rows=[["Data","Operador","Lote","Tipo","Qtd operações","Valor por operação","Valor","Situação","Observação"]];
  const all=[...S.lanc.values()].filter(e=>S.view==="todos"||e.op===S.view).sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:(a.createdAt||0)-(b.createdAt||0));
  for(const e of all){const L=S.lotes.get(e.loteId);const [y,m,d]=e.data.split("-");rows.push([`${d}/${m}/${y}`,opName(e.op),L?L.nome:(e.loteId?"(lote excluído)":"Caixa"),{investimento:"Investimento",recolhimento:"Recolhimento",aporte:"Aporte",retirada:"Retirada"}[e.tipo]||e.tipo,e.qtd??"",n(e.valorOp),n(e.valor),e.status==="previsto"?"Previsto":"Realizado",e.obs||""])}
  const csv="﻿"+rows.map(r=>r.map(c=>{c=String(c??"");return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(";")).join("\r\n");
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download=`controle-lotes-${todayISO()}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function setView(v){S.view=v;store.set("cl_view",v);render()}
document.addEventListener("click",ev=>{
  const c=ev.target.closest("[data-close]");if(c&&(c===ev.target||c.tagName==="BUTTON")){closeModal();return}
  const cp=ev.target.closest("[data-copy]");if(cp){const el=document.getElementById(cp.dataset.copy);el.select();const done=()=>{cp.textContent="Copiado";setTimeout(()=>{if(cp.isConnected)cp.textContent=cp.dataset.copy==="acc"?"Copiar mensagem":"Copiar"},1800)};
    (navigator.clipboard?navigator.clipboard.writeText(el.value):Promise.reject()).then(done).catch(()=>{try{document.execCommand("copy");done()}catch(_){toast("Selecione o texto e copie")}});return}
  if(ev.target.closest("[data-act=editop]")){openOperador(ev.target.closest("[data-act]").dataset.id);return}
  const vo=ev.target.closest("[data-verop]");if(vo){setView(vo.dataset.verop);S.tab="lotes";render();window.scrollTo({top:0,behavior:"smooth"});return}
  const lote=ev.target.closest("[data-lote]");if(lote){openLote(lote.dataset.lote);return}
  const chip=ev.target.closest("[data-f]");if(chip){S.filter=chip.dataset.f;document.querySelectorAll("#chips .chip").forEach(b=>b.setAttribute("aria-pressed",String(b===chip)));render();return}
  const tab=ev.target.closest("[data-tab]");if(tab){S.tab=tab.dataset.tab;render();return}
  const a=ev.target.closest("[data-act]");if(!a)return;const act=a.dataset.act,id=a.dataset.id;
  if(act==="novo")openNovo();
  else if(act==="lancar")openLancar(id);
  else if(act==="caixa")openCaixa();
  else if(act==="config")openConfig();
  else if(act==="export")exportCSV();
  else if(act==="novoop")openOperador();
  else if(act==="linkacesso")openLinkAcesso();
  else if(act==="sair"){sair("Você saiu.")}
  else if(act==="trocarlink"){store.del("cl_url");CONN.url="";S.temAdmin=null;S.authMsg="";render()}
  else if(act==="sync"){toast("Atualizando…");refresh(false).then(()=>{if(S.loaded)toast("Atualizado às "+S.syncedAt)})}
  else if(act==="receber"){const e=S.lanc.get(id);if(!e)return;const t=todayISO();const inModal=!!$("#modal-root").innerHTML;write("receber",{id,data:e.data>t?t:e.data},"Marcado como recebido").then(ok=>{if(ok&&inModal&&e.loteId)openLote(e.loteId)})}
  else if(act==="del")arm(a,"del"+id,"Confirmar",()=>{const e=S.lanc.get(id);const inModal=!!$("#modal-root").innerHTML;write("excluirLancamento",{id},"Lançamento excluído").then(ok=>{if(ok&&inModal&&e?.loteId)openLote(e.loteId)})})
  else if(act==="dellote")arm(a,"dl"+id,"Confirmar exclusão do lote e lançamentos",async()=>{if(await write("excluirLote",{id},"Lote excluído"))closeModal()});
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&$("#modal-root").innerHTML)closeModal();const tr=ev.target.closest?.("[data-verop]");if(tr&&ev.key==="Enter")tr.click()});
document.addEventListener("submit",async ev=>{
  const f=ev.target;if(!f.id||!f.id.startsWith("fa-"))return;ev.preventDefault();
  const err=f.querySelector("#a-err"),btn=f.querySelector("button[type=submit]");const val=id=>(f.querySelector("#"+id)?.value||"").trim();
  err.textContent="";
  if(f.id==="fa-url"){const url=val("a-url");if(!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url))return err.textContent="Cole o link do app da Web. Ele começa com https://script.google.com e termina em /exec.";
    CONN.url=url;store.set("cl_url",url);return checarStatus()}
  const label=btn.textContent;btn.disabled=true;btn.textContent="Aguarde…";
  try{
    if(f.id==="fa-login"){if(!val("a-user")||!f.querySelector("#a-pass").value)throw new Error("Digite usuário e senha.");await api("login",{usuario:val("a-user"),senha:f.querySelector("#a-pass").value})}
    else if(f.id==="fa-admin"){const s1=f.querySelector("#a-pass").value,s2=f.querySelector("#a-pass2").value;
      if(!val("a-nome"))throw new Error("Informe o seu nome.");if(s1.length<6)throw new Error("A senha precisa ter pelo menos 6 caracteres.");if(s1!==s2)throw new Error("As senhas não conferem.");if(!val("a-chave"))throw new Error("Cole a chave da planilha.");
      await api("criarAdmin",{nome:val("a-nome"),usuario:val("a-user"),senha:s1,chave:val("a-chave")})}
    S.authMsg="";
  }catch(e){if(err.isConnected)err.textContent=e.message}
  finally{if(btn.isConnected){btn.disabled=false;btn.textContent=label}}
});
$("#scope").addEventListener("change",ev=>setView(ev.target.value));
$("#q").addEventListener("input",ev=>{S.q=ev.target.value;renderLotes(S.C||compute())});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh(true)});
setInterval(()=>{if(document.visibilityState==="visible"&&!$("#modal-root").innerHTML)refresh(true)},60000);

/* ---------- início ---------- */
if(CONN.url&&CONN.token){S.temAdmin=true;render();api("listar").catch(e=>{if(e.codigo!=="sessao"){S.authMsg=e.message;render()}})}
else checarStatus();
})();
</script>
</body>
</html>
