     <div style="font:800 21pt 'MontserratL';color:#fff">NESTA EDIÇÃO</div>
     <div style="font:700 7.2pt 'MontserratL';letter-spacing:.26em;color:var(--gold2)">EDIÇÃO 02 · DEZEMBRO 2026</div></div>
    <div id="tocl" style="flex:1;display:flex;flex-direction:column;justify-content:space-between"><div class="item"><div class="n">03</div><div style="flex:1"><div class="e">Opinião</div><div class="t">A defesa do Brasil precisa ser de Estado, não de governo</div><div class="a">Luiz Alberto Cureau Júnior</div></div><div class="th bgimg" style="background-image:url('img/cureau.jpg')"></div></div><div class="item"><div class="n">06</div><div style="flex:1"><div class="e">Economia de Defesa</div><div class="t">A indústria de Defesa como fator de impulsionamento da economia</div><div class="a">Tenente-Brigadeiro Domingues</div></div><div class="th bgimg" style="background-image:url('img/industria.jpg')"></div></div><div class="item"><div class="n">10</div><div style="flex:1"><div class="e">Espaço</div><div class="t">SpaceX e a lição para o Brasil: sem demanda estratégica não há soberania espacial sustentável</div><div class="a">José Vagner Vital</div></div><div class="th bgimg" style="background-image:url('img/foguete.jpg')"></div></div><div class="item"><div class="n">15</div><div style="flex:1"><div class="e">Espaço Aéreo</div><div class="t">Campo de Marte por instrumentos</div><div class="a">Ary Rodrigues Bertolino</div></div><div class="th bgimg" style="background-image:url('img/campo.jpg')"></div></div><div class="item"><div class="n">18</div><div style="flex:1"><div class="e">Inovação</div><div class="t">UAV4PAPI: da pesquisa aeronáutica à aferição do auxílio visual de aproximação no Campo de Marte</div><div class="a">Rubem Müller Schneider</div></div><div class="th bgimg" style="background-image:url('img/uav.jpg')"></div></div><div class="item"><div class="n">22</div><div style="flex:1"><div class="e">Tráfego Aéreo</div><div class="t">R-AFIS e EMS-R: inovação na prestação de serviços de informação de voo em múltiplas localidades</div><div class="a">Felipe do Souto de Sá Gille e Ary Rodrigues Bertolino</div></div><div class="th bgimg" style="background-image:url('img/rafis.jpg')"></div></div><div class="item"><div class="n">27</div><div style="flex:1"><div class="e">Aviação e Sociedade</div><div class="t">Maricá aproveita oportunidades no setor de aviação para desenvolver projetos sociais, profissionais e de inclusão</div><div class="a">Rogério Benevides Carvalho</div></div><div class="th bgimg" style="background-image:url('img/marica.jpg')"></div></div><div class="item"><div class="n">31</div><div style="flex:1"><div class="e">Direito Marítimo</div><div class="t">Registro de embarcações e armadores no Tribunal Marítimo</div><div class="a">Dionísio Tavares da Câmara Junior</div></div><div class="th bgimg" style="background-image:url('img/porto.jpg')"></div></div></div></div><div class="ft"><span>Revista BID · Sumário</span><span class="pn">02</span></div></section><section class="page" data-art="cureau"><div class="hero bgimg" style="height:150mm;background-image:url('img/cureau.jpg');background-position:center 55%"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Opinião</span></div>
   <div class="kick">Opinião · Defesa Nacional</div><div class="ttl ">A defesa do Brasil precisa ser de Estado, não de governo</div><div class="deck">Programas estratégicos não podem depender do calendário eleitoral. A escolha de quem conduz o Ministério da Defesa revela a maturidade estratégica de uma nação.</div></div>
   <div class="byl"><div class="ph" style=""></div><div><div class="nm">Luiz Alberto Cureau Júnior</div><div class="cr">General do Exército Brasileiro da Reserva e consultor em Defesa e Clima</div></div></div>
   <div class="bd" style="padding-top:4mm"><div class="flow" style="height: 419.562px; flex: 0 0 auto;"><p class="drop">Enquanto se especula sobre quem ocupará o Ministério da Defesa, inclusive com manifestações de preferência pela indicação de uma mulher, talvez estejamos, mais uma vez, fazendo a pergunta errada.</p><p>A discussão não deveria estar concentrada no gênero, na filiação partidária, na proximidade com o presidente da República ou na capacidade de agradar simultaneamente ao governo e aos comandantes militares. A questão fundamental deveria ser outra: quem possui competência, experiência, capacidade de gestão e visão estratégica para conduzir a Defesa Nacional?</p><p>Homem ou mulher, civil ou militar, o Brasil precisa de alguém preparado para pensar o País muito além de um mandato presidencial. Alguém que compreenda que a Defesa não pertence a governos, partidos ou correntes ideológicas. Pertence à Nação.</p><p>Em países que levam sua soberania a sério, a Defesa é tratada como uma responsabilidade permanente do Estado. Governos estabelecem prioridades e exercem legitimamente a direção política, mas não deveriam comprometer a continuidade das capacidades estratégicas nacionais a cada alternância de poder.</p><p>No Brasil, entretanto, ainda convivemos com uma preocupante dificuldade de transformar planejamento em continuidade. Programas são anunciados, investimentos são prometidos, projetos são iniciados e, frequentemente, os recursos necessários à sua execução tornam-se vítimas de contingenciamentos, mudanças de prioridades ou conveniências políticas.</p><p>O resultado é um ciclo de descontinuidade que compromete não apenas a capacidade operacional das Forças Armadas, mas também o desenvolvimento tecnológico, a indústria nacional e a credibilidade do País perante seus parceiros internacionais.</p><p>O Ministério da Defesa não pode ser tratado como espaço de acomodação política, negociação partidária ou simples administração das relações entre o governo e os militares. Sua missão é muito maior e exige uma compreensão abrangente dos interesses nacionais.</p></div></div><div class="ft"><span>Revista BID · Opinião</span><span class="pn">03</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Opinião</span></div><div class="bd"><div class="band bgimg" style="height:82mm;background-image:url('img/submarino.jpg')"></div><div class="flow" style="height: 667.125px; flex: 0 0 auto;"><p>Cabe ao Ministério coordenar a preparação do Brasil para ameaças presentes e futuras, fortalecer as capacidades militares, integrar o planejamento das três Forças, estimular tecnologias estratégicas e assegurar que o País disponha dos meios necessários para proteger seu território, suas riquezas, sua população e seus interesses.</p><p>Estamos falando de uma nação continental, com mais de oito milhões de quilômetros quadrados de território, extensas fronteiras terrestres, uma imensa área marítima de interesse estratégico, recursos naturais extraordinários e infraestruturas críticas cada vez mais vulneráveis a ameaças convencionais, híbridas e cibernéticas.</p><p>Não é razoável que um país com essas características continue tratando a Defesa como uma questão secundária na definição das prioridades nacionais.</p><p>Submarinos, aeronaves, blindados, sistemas de defesa antiaérea, vigilância de fronteiras, inteligência, capacidades espaciais, segurança cibernética e tecnologias disruptivas não podem depender do humor político ou das circunstâncias econômicas de cada exercício financeiro.</p><p>São capacidades construídas ao longo de décadas, que exigem investimentos continuados, profissionais especializados, infraestrutura adequada e uma cadeia industrial capaz de sustentar sua operação, manutenção e modernização.</p><div class="quote">Uma potência não se constrói com programas estratégicos subordinados ao calendário eleitoral.</div><p>O Brasil precisa de planejamento plurianual consistente, previsibilidade orçamentária, mecanismos legais de proteção aos investimentos estratégicos e critérios claros para definir prioridades. É necessário assegurar a continuidade dos programas em execução e, simultaneamente, criar condições para desenvolver novas capacidades, sem comprometer aquelas já existentes.</p><p>Essa previsibilidade também é indispensável à Base Industrial de Defesa (BID).</p><p>Nenhuma empresa investe continuamente em pesquisa, contrata engenheiros, desenvolve tecnologias complexas e amplia sua capacidade produtiva sem perspectivas minimamente confiáveis de demanda. A ausência de encomendas regulares e a instabilidade dos investimentos provocam perda de profissionais qualificados, enfraquecimento de fornecedores nacionais e crescente dependência tecnológica externa.</p><p>Países como Estados Unidos, Israel, Coreia do Sul, França e Turquia, respeitadas suas diferenças, compreenderam que a indústria de Defesa representa muito mais do que a fabricação de armamentos. É instrumento de inovação, geração de empregos qualificados, desenvolvimento econômico, influência diplomática e autonomia estratégica.</p><p>O Brasil possui competência técnica, instituições de pesquisa reconhecidas e empresas capazes de competir internacionalmente. O que falta é transformar essas capacidades em uma política industrial de Defesa permanente, articulada com as necessidades operacionais das Forças Armadas e com os interesses econômicos nacionais.</p><p>Nesse contexto, a escolha do próximo ministro da Defesa assume importância extraordinária.</p><p style="text-align-last: justify;">Não basta conhecer a estrutura militar ou possuir habilidade política. O ocupante do cargo precisa compreender</p></div></div><div class="ft"><span>Revista BID · Opinião</span><span class="pn">04</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Opinião</span></div><div class="bd"><div class="flow last" style="height: auto; flex: 0 0 auto;"><p>orçamento público, gestão de grandes projetos, indústria, tecnologia, diplomacia, geopolítica e estratégia militar. Deve possuir autoridade institucional para dialogar com os comandantes das Forças, mas também capacidade de defender prioridades perante a equipe econômica, o Congresso Nacional e a sociedade brasileira.</p><p>Precisa, sobretudo, compreender que administrar a Defesa não significa apenas distribuir recursos escassos entre Exército, Marinha e Aeronáutica. Significa estabelecer prioridades nacionais, buscar integração, eliminar sobreposições, cobrar resultados e construir capacidades compatíveis com os desafios do século XXI.</p><p>A subordinação das Forças Armadas ao poder civil democraticamente constituído é princípio essencial e inquestionável. Entretanto, lealdade institucional não significa submissão intelectual, assim como autoridade política não substitui conhecimento técnico.</p><p>Um ministro competente deve saber ouvir, questionar, decidir e assumir responsabilidades. Deve ter independência de julgamento, compromisso com a Constituição e capacidade de apresentar ao presidente da República diagnósticos realistas, mesmo quando politicamente inconvenientes.</p><p>A escolha de uma mulher poderá representar um avanço importante, desde que fundamentada nos mesmos critérios de competência exigidos de qualquer candidato. O Brasil não necessita de uma escolha simbólica. Necessita de uma escolha estratégica.</p><p>O Ministério da Defesa não pode ser um prêmio político, tampouco um cargo ocupado apenas para administrar crises institucionais.</p><p>É preciso superar definitivamente a visão de que investir em Defesa representa retirar recursos de outras prioridades nacionais. Segurança, desenvolvimento, tecnologia e soberania não são objetivos incompatíveis. Ao contrário, uma estrutura de Defesa eficiente contribui para a estabilidade institucional, a proteção das riquezas nacionais e o desenvolvimento econômico.</p><p>A escolha de um ministro revela, portanto, muito mais do que a composição de um governo. Revela o grau de maturidade estratégica de uma nação e a importância que ela atribui à própria independência.</p><p>A pergunta não deveria ser quem o governo deseja colocar no Ministério da Defesa. A pergunta deveria ser quem o Brasil precisa ter à frente dele.</p><p>Porque governos passam, presidentes se sucedem e ministros são substituídos. Mas o território, os interesses nacionais, as ameaças e a responsabilidade de proteger o País permanecem.</p><p>A soberania não pode depender de mandatos. E a Defesa Nacional não pode recomeçar a cada eleição.<span class="end"></span></p></div><div class="fill bgimg" style="background-image:url('img/sala.jpg')"></div></div><div class="ft"><span>Revista BID · Opinião</span><span class="pn">05</span></div></section><section class="page" data-art="domingues"><div class="hero bgimg" style="height:150mm;background-image:url('img/industria.jpg');background-position:center 50%"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Economia de Defesa</span></div>
   <div class="kick">Economia de Defesa · Base Industrial de Defesa</div><div class="ttl m">A indústria de Defesa como fator de impulsionamento da economia</div><div class="deck">Em um mundo instável, a Base Industrial de Defesa gera demanda, inovação e empregos qualificados, ao mesmo tempo em que garante soberania e independência.</div></div>
   <div class="byl"><div class="ph" style=""></div><div><div class="nm">Tenente-Brigadeiro Domingues</div><div class="cr">Autor convidado da Revista BID</div></div></div>
   <div class="bd" style="padding-top:4mm"><div class="flow" style="height: 419.562px; flex: 0 0 auto;"><p class="drop">Em um mundo conturbado e economicamente instável, no qual os aliados não estão bem definidos e disputam espaço na geopolítica com grande empenho, a autonomia em defesa deixou de ser apenas uma questão militar. Tornou-se um imperativo para a manutenção da soberania, a proteção dos interesses nacionais e a projeção de influência regional e internacional.</p><p>Nesse cenário, assim como em outros momentos históricos de crise mundial, a indústria de Defesa desponta como grande impulsionadora da economia, ao mesmo tempo em que garante soberania e independência.</p><p>Nos países mais desenvolvidos, os investimentos estatais massivos no setor de Defesa, realizados em momentos de retração do investimento privado, geram demanda imediata, impulsionam a inovação tecnológica e reestruturam cadeias produtivas inteiras. Dessa forma, atuam como um poderoso motor de recuperação e crescimento econômico.</p><p>No Brasil, segundo a Associação Brasileira das Indústrias de Materiais de Defesa e Segurança (ABIMDE), a base industrial de defesa e segurança representa 4% do Produto Interno Bruto (PIB). Para cada R$ 10 milhões investidos em projetos de defesa, são gerados cerca de R$ 18,6 milhões em efeitos diretos e indiretos, além de 132 empregos. Essa base também exporta mais de US$ 3,5 bilhões por ano, o que a consolida como peça-chave da economia brasileira.</p><div class="stats"><div><b>4%</b>do PIB brasileiro é a participação da base industrial de defesa e segurança</div><div><b>R$ 18,6 mi</b>em efeitos diretos e indiretos para cada R$ 10 milhões investidos</div><div><b>132</b>empregos gerados a cada R$ 10 milhões investidos</div><div><b>US$ 3,5 bi</b>em exportações por ano</div></div><h3>E como isso acontece?</h3><p style="text-align-last: justify;"><b>Efeito multiplicador na cadeia produtiva.</b> A fabricação de equipamentos militares exige insumos de diversos setores civis, como siderurgia, química, eletrônica, logística e construção civil. Isso gera capital e crescimento</p></div></div><div class="ft"><span>Revista BID · Economia de Defesa</span><span class="pn">06</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Economia de Defesa</span></div><div class="bd"><div class="band bgimg" style="height:82mm;background-image:url('img/ciber.jpg')"></div><div class="flow" style="height: 667.125px; flex: 0 0 auto;"><p>econômico e mobiliza uma vasta cadeia que inclui centros de pesquisa e desenvolvimento, universidades, indústrias, laboratórios e empresas de serviços e logística.</p><p><b>Transbordamento tecnológico (spin-offs).</b> As pesquisas financiadas pelo orçamento militar frequentemente resultam em tecnologias que, mais tarde, revolucionam o mercado civil e criam novas indústrias altamente lucrativas.</p><p>Após a pandemia de COVID-19 e com o agravamento dos conflitos internacionais a partir de 2022, o aumento dos orçamentos de defesa, principalmente na Europa, no Oriente Médio e nos Estados Unidos da América, impulsionou a reindustrialização de regiões afetadas pela desaceleração manufatureira. Esse movimento gerou empregos de alta qualificação em engenharia, cibersegurança e manufatura avançada.</p><h3>O Brasil está preparado para enfrentar esse momento?</h3><p>Primeiro, é preciso entender o conceito de Base Industrial de Defesa (BID): o conjunto de empresas estatais e privadas que atuam na pesquisa, no desenvolvimento, na fabricação, na distribuição e na manutenção de produtos estratégicos voltados à segurança e à defesa do país. A BID tem duas características principais:</p><p><b>Coordenação:</b> é liderada e supervisionada pelo Ministério da Defesa e envolve a cooperação entre o setor produtivo (predominantemente privado) e o setor de pesquisa e desenvolvimento ligado ao Estado.</p><p><b>Soberania nacional:</b> garante a autonomia tecnológica e o suprimento de equipamentos para as Forças Armadas, diminuindo a dependência externa.</p><p>Nesse contexto, o Ministério da Defesa vem atuando para criar condições favoráveis ao fortalecimento da BID brasileira. As duas principais iniciativas nesse sentido foram a instituição do Plano de Articulação e Equipamento de Defesa (PAED) e da Lei de Fomento à Base Industrial de Defesa, que permitiram reduzir o custo de produção das companhias legalmente classificadas como estratégicas e estabeleceram incentivos ao desenvolvimento de tecnologias indispensáveis ao Brasil.</p><p>Entre os pontos de destaque para o desenvolvimento da BID, a Estratégia Nacional de Defesa (END) coloca o domínio de tecnologias duais, a promoção da exportação de produtos, a formação de parcerias e a importância da tríplice hélice (governo, academia e setor privado). A END também identificou três setores estratégicos (espacial, cibernético e nuclear), aos quais a BID deve estar atenta.</p><h3>Resultados tangíveis</h3><p>Graças a essas iniciativas, vários projetos de grande envergadura foram lançados com sucesso.</p><p>O Programa de Desenvolvimento de Submarinos (PROSUB), com a construção de submarinos convencionais e o desenvolvimento de um submarino com propulsão nuclear, representa um salto tecnológico sem precedentes para a Marinha do Brasil e para a indústria naval.</p><p>O PROSUB gera desenvolvimento tecnológico dual. A construção de reatores compactos e pressurizados exige avanços em metalurgia, automação, materiais e engenharia de precisão, que transbordam para a indústria civil e reduzem a dependência externa.</p><p style="text-align-last: left;">Além disso, há várias aplicações nas áreas de saúde e energia. O domínio da tecnologia nuclear impulsiona a produção de radiofármacos para diagnóstico e</p></div></div><div class="ft"><span>Revista BID · Economia de Defesa</span><span class="pn">07</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Economia de Defesa</span></div><div class="bd"><div class="flow" style="height: 994.031px; flex: 0 0 auto;"><p>tratamento médico, a irradiação de alimentos e o desenvolvimento de pequenos reatores modulares para geração de energia elétrica limpa.</p><p>O cargueiro multimissão KC-390 Millennium, desenvolvido pela Embraer em parceria com a Força Aérea Brasileira (FAB), consolidou a empresa como uma das líderes mundiais em aviação militar. O cargueiro tem conquistado relevância global, com encomendas e entregas em diversos países europeus (como Portugal, Hungria, Holanda, Áustria, Suécia e República Tcheca, entre outros), o que consolida o Brasil como exportador competitivo de equipamentos militares avançados.</p><p>O software de controle de voo fly-by-wire, inteiramente concebido no Brasil, representa um grande salto na capacidade industrial do país e permite que a indústria local desenvolva novas tecnologias para futuras aeronaves civis e militares.</p><p>A viatura blindada de transporte de pessoal (VBTP) Guarani, produzida pela IVECO em parceria com o Exército Brasileiro, modernizou a frota terrestre e gerou um importante ciclo de desenvolvimento e produção nacional.</p><p>A produção nacional evita que o país fique vulnerável a embargos comerciais, sanções ou atrasos na entrega de peças de reposição em momentos de crise internacional ou de conflito. Além disso, muitas inovações desenvolvidas para o setor militar, como ligas metálicas mais leves, suspensões de alta resistência e sistemas de comunicação criptografados, acabam sendo absorvidas pela indústria civil, elevando o patamar tecnológico do país como um todo.</p><p>É importante destacar que também há empresas 100% nacionais, de segmentos diferentes do armamento e dos veículos, que são referências mundiais em suas áreas, embora pouco conhecidas do público. Entre elas, destacamos duas, de áreas distintas: Gestão do Tráfego Aéreo e Cibersegurança.</p><h3>Gestão do tráfego aéreo</h3><p>O Brasil adota um modelo singular, que integra o controle do tráfego aéreo civil e a defesa aérea militar (por meio do Sistema de Controle do Espaço Aéreo Brasileiro, o SISCEAB, e do Sistema de Defesa Aeroespacial Brasileiro, o SISDABRA). Dispor de tecnologia desenvolvida no país garante que o Estado brasileiro não dependa de fornecedores estrangeiros críticos para monitorar seus cerca de 22 milhões de km² de espaço aéreo, que incluem áreas sobre o Oceano Atlântico.</p><p>Investir em tecnologias nacionais é essencial porque, em eventuais cenários de tensão geopolítica ou de sanções internacionais, a dependência de tecnologia estrangeira em infraestruturas críticas (como aviação e defesa) poderia paralisar setores essenciais do país. A autonomia tecnológica assegura independência de decisão.</p><p>Nesse contexto, a Força Aérea Brasileira conta com a parceria de empresas 100% nacionais, entre as quais a SAIPHER ATC.</p><p>A Saipher é uma empresa brasileira de tecnologia especializada no desenvolvimento de softwares e soluções para o Controle e o Gerenciamento de Tráfego Aéreo (ATC/ATM). Fundada em 1995, ficou mundialmente conhecida por ser pioneira no desenvolvimento do conceito de Electronic Flight Progress Strips (EFPS), as fichas eletrônicas de progressão de voo usadas em torres de controle.</p><p>Seus sistemas operam em mais de 180 aeródromos brasileiros, de estações de informação de voo (AFIS) a grandes aeroportos internacionais, como Guarulhos (SBGR), Galeão (SBGL) e Viracopos (SBKP).</p><p>A empresa é credenciada pelo Ministério da Defesa como Empresa Estratégica de Defesa (EED), e seus softwares são classificados como Produtos Estratégicos de Defesa (PED). Possui ainda certificação ISO 9001:2015 e adota padrões da ISO 27001.</p><h3>Cibersegurança</h3><p>Nos últimos dois anos (2025 e 2026), o cenário global de cibersegurança foi marcado por uma escalada sem precedentes. Segundo análise da Forbes Tech sobre ameaças a serviços essenciais, os ataques deixaram de visar apenas o roubo financeiro ou de dados e passaram a comprometer diretamente infraestruturas físicas, cadeias de suprimentos e serviços públicos vitais, impulsionados pelo uso ofensivo da Inteligência Artificial.</p><p>Para demonstrar a importância dessa área para a segurança nacional, destacamos alguns dos acontecimentos mais recentes:</p><p><b>Ataque a sistemas de refrigeração na Europa (novembro de 2026).</b> Hackers invadiram remotamente controladores conectados à internet de mais de 500 supermercados na França, além de alvos na Suécia, na Bélgica, na Irlanda e em outros países europeus, elevando a temperatura dos freezers a até 50 °C. A União Europeia classificou o episódio como uma tentativa deliberada de sabotar o abastecimento alimentar.</p><p><b>O maior roubo de criptomoedas da história na corretora Bybit (fevereiro de 2025).</b> Hackers exploraram uma falha em um sistema de armazenamento de terceiros utilizado pela corretora, com sede em Dubai, e desviaram US$ 1,5 bilhão em Ethereum em uma única operação.</p></div></div><div class="ft"><span>Revista BID · Economia de Defesa</span><span class="pn">08</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Economia de Defesa</span></div><div class="bd"><div class="flow last" style="height: auto; flex: 0 0 auto;"><p><b>Onda de ataques no Brasil (novembro de 2026).</b> Conforme noticiado pela Radioagência Nacional, o Porto de Santos teve sistemas internos e portais derrubados por dias após uma invasão. Na mesma semana, o Tesouro Nacional confirmou o acesso indevido a 30 mil cadastros de usuários e 4 mil chaves Pix de beneficiários federais, enquanto a seguradora Caixa Vida e Previdência também sofreu exposição cadastral de milhões de clientes.</p><p>Nesse ambiente, o Brasil conta com uma empresa classificada entre as cinco melhores do mundo: a SEGURA.</p><p>A SEGURA (anteriormente conhecida como Senha Segura) é uma empresa brasileira líder global em Gestão de Acesso Privilegiado (PAM) e segurança de identidade. Com mais de 20 anos de experiência e atuação em três continentes, desenvolve soluções para proteger credenciais críticas e controlar acessos de identidades humanas, de máquinas e autônomas. A empresa tem destaque internacional e atende a rigorosos padrões regulatórios:</p><p><b>Reconhecimento de mercado.</b> Foi nomeada Challenger no Quadrante Mágico do Gartner para PAM em 2026, pelo quinto ano consecutivo, e conta com 97% de recomendação no Gartner Peer Insights.</p><p><b>Certificações e normas.</b> Suas soluções auxiliam as empresas na conformidade com normas como ISO 27001, PCI DSS, HIPAA, GDPR e SOX.</p><h3>O Brasil tem as respostas</h3><p>Podemos concluir que o impacto da Base Industrial de Defesa brasileira vai muito além da segurança nacional: ela é um motor econômico robusto e um vetor de projeção internacional para o país.</p><p>Trata-se de uma indústria vigorosa, que reúne mais de 1.200 empresas associadas a entidades como a ABIMDE, o SIMDE (Sindicato Nacional das Indústrias de Materiais de Defesa e Segurança), a ABIMAQ (Associação Brasileira da Indústria de Máquinas e Equipamentos) e o PIT SJC (Parque de Inovação Tecnológica de São José dos Campos). Essas empresas, muitas delas pequenas e médias, formam uma complexa cadeia de valor que gera um número expressivo de empregos diretos e indiretos, muitos deles altamente qualificados, em áreas como engenharia, pesquisa e desenvolvimento e manufatura avançada. Esse capital humano é um ativo inestimável para o desenvolvimento tecnológico do país.<span class="end"></span></p><p class="note">Fontes citadas: ABIMDE; Forbes Tech, "Como ataques cibernéticos já ameaçam o funcionamento de serviços essenciais" (nov. 2026); Radioagência Nacional/Agência Brasil (nov. 2026).</p></div><div class="fill bgimg" style="background-image:url('img/estaleiro.jpg')"></div></div><div class="ft"><span>Revista BID · Economia de Defesa</span><span class="pn">09</span></div></section><section class="page" data-art="vital"><div class="hero bgimg" style="height:150mm;background-image:url('img/foguete.jpg');background-position:center 45%"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Espaço</span></div>
   <div class="kick">Espaço · Soberania espacial</div><div class="ttl m">SpaceX e a lição para o Brasil: sem demanda estratégica não há soberania espacial sustentável</div><div class="deck">A experiência americana demonstra que financiar a inovação é necessário, mas contratar capacidades operacionais é indispensável para consolidar uma indústria espacial nacional.</div></div>
   <div class="byl"><div class="ph" style=""></div><div><div class="nm">José Vagner Vital</div><div class="cr">Brigadeiro do Ar R1, engenheiro eletrônico pelo ITA e CEO do Instituto Start</div></div></div>
   <div class="bd" style="padding-top:4mm"><div class="flow" style="height: 419.562px; flex: 0 0 auto;"><h3>A lição por trás do sucesso da SpaceX</h3><p class="drop">A trajetória da SpaceX é frequentemente apresentada como a história de um empreendedor visionário que revolucionou a indústria espacial. Embora essa interpretação reconheça corretamente o papel da iniciativa privada e da inovação tecnológica, ela é insuficiente para explicar como uma empresa fundada em 2002 se transformou em um dos principais protagonistas da economia espacial mundial.</p><p>Por trás dos foguetes reutilizáveis, da constelação Starlink e dos ambiciosos projetos de exploração de Marte, existe um componente estratégico fundamental, nem sempre devidamente valorizado: a atuação do governo americano como financiador do desenvolvimento tecnológico, cliente e indutor de demanda.</p><p>A NASA e o Departamento de Defesa dos Estados Unidos não foram meros espectadores do crescimento da SpaceX. Suas decisões de contratação contribuíram decisivamente para criar as condições econômicas e operacionais que permitiram à empresa desenvolver, testar, amadurecer e comercializar novas capacidades espaciais.</p><p>Essa experiência oferece uma lição particularmente relevante para o Brasil e para sua Base Industrial de Defesa (BID). O desafio nacional não se restringe à obtenção de recursos para financiar a inovação tecnológica. É necessário, sobretudo, criar demanda estratégica capaz de transformar essa inovação em capacidade operacional, desenvolvimento industrial e autonomia nacional.</p><h3>O papel decisivo do Estado como cliente</h3><p>Em seus primeiros anos, a SpaceX enfrentou consideráveis dificuldades tecnológicas e financeiras. As três primeiras tentativas de lançamento do Falcon 1 fracassaram, colocando em risco a continuidade da empresa. O sucesso orbital alcançado em setembro de 2008 demonstrou a viabilidade de sua tecnologia, mas ainda não assegurava a sustentabilidade do negócio.</p><p style="text-align-last: left;">A atuação da NASA foi determinante nesse processo. Por meio do programa Commercial Orbital Transportation Services (COTS), a agência apoiou o</p></div></div><div class="ft"><span>Revista BID · Espaço</span><span class="pn">10</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Espaço</span></div><div class="bd"><div class="band bgimg" style="height:82mm;background-image:url('img/satelite.jpg')"></div><div class="flow" style="height: 667.125px; flex: 0 0 auto;"><p>desenvolvimento e a demonstração de capacidades comerciais de transporte espacial. Em dezembro de 2008, avançou para a contratação de serviços de reabastecimento da Estação Espacial Internacional, no âmbito do programa Commercial Resupply Services (CRS), em um contrato com a SpaceX de aproximadamente US$ 1,6 bilhão.</p><p>A distinção entre esses dois programas é particularmente importante. Enquanto o primeiro buscava viabilizar o desenvolvimento e a demonstração de novas capacidades tecnológicas, o segundo estabelecia uma demanda concreta pelos serviços que essas capacidades tornariam possíveis.</p><p>O contrato representou muito mais do que uma oportunidade comercial. Proporcionou previsibilidade de demanda, estabeleceu requisitos operacionais e criou condições favoráveis à continuidade dos investimentos privados.</p><div class="quote">A NASA não estava simplesmente financiando uma empresa. Estava contratando um serviço estratégico de que necessitava.</div><p>Posteriormente, os programas de transporte de cargas e tripulações, associados à evolução do Falcon 9 e da cápsula Dragon, consolidaram a posição da SpaceX como fornecedora de serviços espaciais.</p><p>Naturalmente, o sucesso da empresa não pode ser atribuído exclusivamente à demanda governamental. A capacidade empreendedora, a inovação tecnológica, os investimentos privados, a integração vertical e a estratégia empresarial foram igualmente relevantes. Entretanto, a existência de um cliente governamental com necessidades concretas e capacidade de contratação criou condições especialmente favoráveis ao amadurecimento tecnológico e industrial da empresa.</p><h3>Da inovação tecnológica à capacidade operacional</h3><p>Uma tecnologia, por mais inovadora que seja, não constitui, isoladamente, uma capacidade estratégica.</p><p>Um equipamento ou sistema pode apresentar excelente desempenho em laboratório, alcançar elevado nível de maturidade tecnológica e, ainda assim, não se transformar em um produto ou serviço operacionalmente disponível. Para que isso aconteça, são necessários investimentos adicionais, infraestrutura, pessoal qualificado, processos industriais, certificação, manutenção e, sobretudo, utilização recorrente.</p><p>A experiência da SpaceX ilustra a formação de um ciclo virtuoso no qual a demanda governamental estimula investimentos tecnológicos, que se convertem em capacidades operacionais. A utilização dessas capacidades proporciona experiência, aprendizado industrial e redução de custos, favorecendo a expansão comercial e a realização de novos investimentos.</p><p>A reutilização de foguetes, por exemplo, tornou-se economicamente relevante à medida que a empresa passou a operar em uma escala que permitia distribuir os custos de desenvolvimento por um número crescente de missões.</p><p>Essa dinâmica evidencia uma distinção fundamental entre financiar o desenvolvimento de uma tecnologia e contratar regularmente os serviços que essa tecnologia torna possíveis.</p><p style="text-align-last: left;">O financiamento de pesquisa e desenvolvimento permite criar novas soluções. A contratação de capacidades</p></div></div><div class="ft"><span>Revista BID · Espaço</span><span class="pn">11</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Espaço</span></div><div class="bd"><div class="flow" style="height: 994.031px; flex: 0 0 auto;"><p>possibilita sua incorporação operacional. A demanda recorrente, por sua vez, cria condições para sustentar empresas, infraestrutura, empregos qualificados e cadeias produtivas.</p><p>Uma política industrial consistente precisa contemplar essas três dimensões de maneira integrada.</p><p>Quando os instrumentos de fomento à inovação não estão associados a perspectivas concretas de utilização das tecnologias desenvolvidas, corre-se o risco de criar uma situação paradoxal: o país investe na formação de competências e no desenvolvimento tecnológico, mas não estabelece condições suficientes para que essas competências se transformem em atividades industriais economicamente sustentáveis.</p><p>Esse problema não é exclusivo do setor espacial. Ele também se manifesta em outros segmentos da Base Industrial de Defesa, nos quais a complexidade tecnológica, os elevados investimentos iniciais e os longos ciclos de desenvolvimento exigem previsibilidade de demanda.</p><h3>Defesa e segurança nacional como indutores da economia espacial</h3><p>A relação entre a SpaceX e o governo americano ultrapassou os serviços de transporte espacial. A expansão da Starlink e o desenvolvimento da Starshield demonstram a crescente integração entre a infraestrutura espacial comercial e as aplicações de defesa e segurança nacional.</p><p>A utilização da Starlink na Ucrânia evidenciou a importância estratégica de sistemas distribuídos e resilientes de comunicações espaciais. Paralelamente, a participação da SpaceX no programa National Security Space Launch (NSSL) consolidou seu papel no lançamento de satélites militares e de inteligência.</p><p>Em abril de 2025, a Força Espacial dos Estados Unidos anunciou contratos referentes à Fase 3, Lane 2, do NSSL, com valores previstos de aproximadamente US$ 5,9 bilhões para a SpaceX, US$ 5,4 bilhões para a United Launch Alliance e US$ 2,4 bilhões para a Blue Origin.</p><p>A estratégia americana revela dois objetivos complementares: assegurar acesso confiável ao espaço para missões críticas de interesse nacional e preservar uma base industrial competitiva, constituída por múltiplos fornecedores.</p><p>Esse segundo aspecto merece especial atenção. A existência de um cliente âncora governamental não precisa resultar na formação de monopólios ou na dependência permanente de um único fornecedor. Quando adequadamente estruturado, o poder de compra do Estado pode estimular simultaneamente a inovação, a concorrência, a redundância operacional e a autonomia estratégica.</p><p>Para a Base Industrial de Defesa brasileira, essa experiência demonstra que a aquisição governamental de produtos e serviços estratégicos não deve ser compreendida exclusivamente como uma despesa destinada ao atendimento de determinada necessidade operacional. Ela também pode constituir um importante instrumento de política industrial, de desenvolvimento tecnológico e de redução de vulnerabilidades nacionais.</p><h3>O Brasil possui competências. É preciso consolidar a demanda.</h3><p>Ao longo de décadas, o Brasil construiu importantes competências científicas, tecnológicas e industriais no setor espacial. Instituições como o Instituto Nacional de Pesquisas Espaciais (INPE), o Departamento de Ciência e Tecnologia Aeroespacial (DCTA), o Instituto Tecnológico de Aeronáutica (ITA) e diversas universidades contribuíram para a formação de recursos humanos altamente qualificados e para o desenvolvimento de tecnologias de significativa complexidade.</p><p>A indústria nacional também acumulou experiências relevantes em satélites, equipamentos embarcados, sistemas de solo, propulsão, rastreamento, software e aplicações espaciais.</p><p>A existência dessas competências, entretanto, não significa que o país disponha de todas as capacidades operacionais necessárias à sua autonomia espacial, tampouco que tenha estabelecido as condições econômicas para sustentá-las ao longo do tempo.</p><p>O Programa Nacional de Atividades Espaciais (PNAE 2022–2031) reconhece a importância dos produtos, serviços e aplicações espaciais para diferentes setores da economia e para o atendimento das necessidades da sociedade brasileira.</p><p>O desafio consiste em transformar esse reconhecimento em programas de contratação capazes de criar demanda previsível, estimular investimentos privados e fortalecer a indústria nacional.</p><p>Mais do que estabelecer objetivos tecnológicos, é necessário identificar quais capacidades espaciais o Estado brasileiro precisa utilizar, quais podem ser fornecidas pela indústria nacional e como estruturar sua aquisição e sustentação ao longo do tempo.</p><p style="text-align-last: justify;">No segmento de acesso ao espaço, por exemplo, o governo poderia estabelecer programas plurianuais de contratação de serviços de lançamento para cargas úteis nacionais, incentivando a formação de operadores</p></div></div><div class="ft"><span>Revista BID · Espaço</span><span class="pn">12</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Espaço</span></div><div class="bd"><div class="flow" style="height: 994.031px; flex: 0 0 auto;"><p>comerciais, o desenvolvimento da cadeia produtiva e a utilização da infraestrutura de lançamento brasileira.</p><p>Na área de Consciência Situacional Espacial e Consciência do Domínio Espacial (Space Situational Awareness, SSA, e Space Domain Awareness, SDA), contratos continuados poderiam estimular a oferta nacional de serviços de rastreamento, catalogação, avaliação de riscos de colisão, previsão de reentradas e monitoramento de objetos espaciais.</p><p>O mesmo raciocínio aplica-se à observação da Terra, às comunicações satelitais, ao processamento de dados e aos serviços espaciais associados à proteção de infraestruturas críticas, à segurança pública, ao monitoramento ambiental e à defesa nacional.</p><p>Não se trata de transferir indiscriminadamente responsabilidades governamentais ao setor privado, mas de estabelecer um modelo de complementaridade no qual o Estado defina suas necessidades estratégicas, estabeleça requisitos operacionais, preserve os mecanismos de supervisão e controle e, sempre que adequado, contrate capacidades disponibilizadas pela indústria.</p><p>A demanda governamental, embora necessária, não é suficiente para assegurar a sustentabilidade industrial. A competitividade, a maturidade tecnológica, a governança, a eficiência das cadeias produtivas e a capacidade de conquistar mercados comerciais também são determinantes. O papel do Estado deve ser o de criar condições para o desenvolvimento de uma indústria capaz de competir, e não perpetuar sua dependência de recursos públicos.</p><h3>Capacidade antes da instituição</h3><p>Uma política espacial deve ser concebida e avaliada, fundamentalmente, pelas capacidades que entrega à sociedade, à economia e à defesa nacional.</p><p>Instituições, programas, instrumentos regulatórios e mecanismos de financiamento são essenciais, mas constituem meios para alcançar determinadas finalidades estratégicas. A existência de uma estrutura institucional não assegura, por si só, a disponibilidade de serviços espaciais, assim como a conclusão de um projeto tecnológico não garante que a capacidade desenvolvida esteja operacionalmente disponível e seja economicamente sustentável.</p><p>Essa perspectiva fundamenta o princípio de Capacidade antes da Instituição (Capability Before Institution), segundo o qual a identificação das necessidades estratégicas e a definição dos resultados operacionais pretendidos devem orientar a organização dos instrumentos institucionais, financeiros, tecnológicos e industriais.</p><p>Não se trata de estabelecer uma precedência cronológica absoluta entre capacidades e instituições, nem de reduzir a importância da governança pública. Trata-se de reconhecer a primazia da finalidade sobre os instrumentos utilizados para alcançá-la.</p><p>Em outras palavras, as instituições devem ser estruturadas e mobilizadas em função das capacidades que o país necessita desenvolver, operar e sustentar.</p><p>Sob essa perspectiva, a avaliação de uma política espacial não deveria se limitar ao volume de recursos investidos, ao número de projetos iniciados ou aos níveis de maturidade tecnológica alcançados. Deveria considerar, principalmente, quais capacidades foram efetivamente incorporadas, quem as utiliza, com que disponibilidade, a que custo e com qual contribuição para a autonomia nacional.</p><p>A partir desse entendimento, o Brasil poderia avançar na construção de uma política de demanda para sua indústria espacial, estruturada em cinco diretrizes:</p><div class="ilist"><div class="it"><div><strong>Identificar as necessidades estratégicas nacionais</strong>Mapear as capacidades e os serviços espaciais necessários à defesa, à segurança, à infraestrutura, à proteção ambiental e ao desenvolvimento econômico.</div></div><div class="it"><div><strong>Estabelecer programas plurianuais de contratação</strong>Criar previsibilidade de demanda suficiente para permitir o planejamento empresarial e a mobilização de investimentos privados, observados os instrumentos legais e orçamentários.</div></div><div class="it"><div><strong>Priorizar a contratação de resultados operacionais</strong>Sempre que adequado, estabelecer requisitos de desempenho, disponibilidade, segurança e qualidade dos serviços, permitindo que a indústria desenvolva soluções tecnológicas competitivas.</div></div><div class="it"><div><strong>Estimular a concorrência e a complementaridade industrial</strong>Promover a participação de diferentes empresas e instituições, evitando dependências excessivas e favorecendo o fortalecimento das cadeias produtivas nacionais.</div></div><div class="it"><div><strong>Integrar os instrumentos de financiamento e contratação</strong>Articular os mecanismos de fomento à inovação com programas governamentais que ofereçam perspectivas concretas de utilização das capacidades desenvolvidas.</div></div></div><p>Essas diretrizes não eliminam a necessidade de pesquisa básica, desenvolvimento tecnológico ou investimento em infraestrutura pública. Procuram estabelecer uma conexão mais efetiva entre esses investimentos e as necessidades estratégicas do país.</p></div></div><div class="ft"><span>Revista BID · Espaço</span><span class="pn">13</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Espaço</span></div><div class="bd"><div class="flow last" style="height: auto; flex: 0 0 auto;"><h3>Soberania espacial não se declara. Constrói-se.</h3><p>A trajetória da SpaceX demonstra como a combinação entre inovação privada e demanda governamental pode contribuir para transformar uma empresa emergente em um fornecedor estratégico de alcance global.</p><p>A lição para o Brasil não consiste em reproduzir mecanicamente o modelo americano, desconsiderando as diferenças de escala econômica, disponibilidade orçamentária e maturidade industrial entre os dois países. Consiste em compreender os mecanismos que permitiram transformar investimentos tecnológicos em capacidades operacionais e estas em atividades industriais competitivas e sustentáveis.</p><p>O Brasil possui competências científicas, tecnológicas e industriais relevantes. Precisa avançar na sua transformação em capacidades operacionais efetivamente disponíveis e sustentáveis, criando condições para que sua Base Industrial de Defesa participe de maneira cada vez mais competitiva da economia espacial.</p><p>A soberania espacial não pressupõe a autossuficiência tecnológica absoluta, mas exige que o país preserve sua capacidade de decisão e de atuação independente em relação aos sistemas e serviços espaciais essenciais aos seus interesses, reduzindo dependências externas críticas.</p><p>Ela não decorre simplesmente da existência de instituições, programas, infraestrutura ou tecnologias. É construída pela capacidade efetiva de acessar, desenvolver, operar, utilizar e sustentar os meios necessários ao atendimento das finalidades estratégicas nacionais.</p><p>Financiar a inovação é necessário. Contratar capacidades é indispensável. Criar demanda recorrente é o que permite transformar essas capacidades em uma indústria sustentável.</p><p>Sem demanda estratégica, a inovação corre o risco de permanecer como projeto. Com demanda consistente, pode transformar-se em capacidade operacional, desenvolvimento industrial e soberania.<span class="end"></span></p><div class="refs"><b>Referências</b><div>AGÊNCIA ESPACIAL BRASILEIRA (AEB). Programa Nacional de Atividades Espaciais, PNAE 2022–2031. Brasília, 2021.</div><div>BRASIL. Decreto nº 1.332, de 8 de dezembro de 1994. Aprova a Política Nacional de Desenvolvimento das Atividades Espaciais (PNDAE).</div><div>NASA. First Contracted SpaceX Resupply Mission Launches with NASA Cargo to Space Station. Washington, 7 out. 2012.</div><div>NASA, Office of Inspector General. NASA’s Response to SpaceX’s June 2015 Launch Failure: Impacts on Commercial Resupply of the International Space Station. Relatório IG-16-025, 2016.</div><div>UNITED STATES SPACE FORCE, Space Systems Command. Space Systems Command Awards National Security Space Launch Phase 3 Lane 2 Contracts. 4 abr. 2025.</div><div>U.S. GOVERNMENT ACCOUNTABILITY OFFICE (GAO). National Security Space Launch: Increased Commercial Use of Ranges Underscores Need for Improved Cost Recovery. Relatório GAO-25-107228, 2025.</div></div><div class="bio"><b>Sobre o autor</b>José Vagner Vital é Oficial General da Reserva da Aeronáutica, com mais de 41 anos de experiência no segmento aeroespacial. Graduado em Engenharia Eletrônica pelo ITA e mestre em Engenharia de Alta Frequência pela Technische Universität München (TUM), é Diretor de Negócios e Inovação da SAIPHER, Diretor do Departamento de Segurança e Defesa (DESEG) da FIESP, Diretor Coordenador do Comitê Aeroespacial do SIMDE e Vice-Presidente da Academia Internacional de Estudos Espaciais (IASS). Participou da criação do Programa Estratégico de Sistemas Espaciais (PESE), em 2012, e coordenou a revisão de seu texto base em 2018. Foi fundador e presidente da Comissão de Coordenação e Implantação de Sistemas Espaciais (CCISE), comandou o CINDACTA II, foi fundador e Chefe da Divisão de Operações do CGNA e contribuiu para a implantação do SIVAM. É formado pela ECEMAR, com MBA em Logística pela UFF, CPEAEx e Curso Superior de Defesa da ESG.</div></div><div class="fill bgimg" style="background-image:url('img/missao.jpg')"></div></div><div class="ft"><span>Revista BID · Espaço</span><span class="pn">14</span></div></section><section class="page" data-art="bertolino"><div class="hero bgimg" style="height:150mm;background-image:url('img/campo.jpg');background-position:center 45%"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Espaço Aéreo</span></div>
   <div class="kick">Espaço Aéreo · Campo de Marte</div><div class="ttl ">Campo de Marte por instrumentos</div><div class="deck">Como o DECEA, a PAX Aeroportos, a ANAC e a Secretaria Nacional de Aviação Civil viabilizaram a implantação do IFR em São Paulo.</div></div>
   <div class="byl"><div class="ph" style=""></div><div><div class="nm">Ary Rodrigues Bertolino</div><div class="cr">Brigadeiro · Revista BID News</div></div></div>
   <div class="bd" style="padding-top:4mm"><div class="flow" style="height: 419.562px; flex: 0 0 auto;"><p class="drop">Às seis da manhã de 28 de dezembro de 2026, o Aeroporto Campo de Marte, na zona norte de São Paulo, deverá iniciar uma nova etapa de sua história. A operação sob regras de voo por instrumentos (IFR) está prevista para começar em uma janela das 6h às 7h, no horário de Brasília, com quatro slots por hora. Por trás dessa primeira hora de operação estão mais de dois anos de estudos, simulações, obras e decisões que envolveram o aeroporto e o espaço aéreo da Região Metropolitana de São Paulo.</p><div class="stats"><div><b>28/12/2026</b>início previsto da operação IFR</div><div><b>6h às 7h</b>janela inicial, no horário de Brasília</div><div><b>4 slots</b>por hora na fase inicial</div><div><b>38 mil</b>objetos projetados no espaço aéreo analisados</div></div><h3>Da concessão ao desenho da operação</h3><p>A implantação do IFR em Campo de Marte foi prevista na concessão do Bloco de Aviação Geral, que também incluiu o Aeroporto de Jacarepaguá, no Rio de Janeiro. O leilão ocorreu em 2022, e a PAX Aeroportos assumiu a administração de Campo de Marte em agosto de 2023. Com as restrições de acesso da aviação geral a Congonhas, a possibilidade de operar por instrumentos em Marte ganhou relevância como alternativa para parte desses operadores.</p><p>Em termos práticos, o IFR permite à tripulação seguir trajetórias publicadas com o auxílio dos instrumentos de bordo. Isso dá maior previsibilidade ao voo quando as condições meteorológicas restringem a operação visual, dentro dos limites de cada procedimento. Em São Paulo, o desafio era acomodar essas trajetórias em um espaço aéreo já compartilhado pelos fluxos de Congonhas e Guarulhos, pelas aeronaves em voo visual e pelos helicópteros.</p><p style="text-align-last: justify;">O Departamento de Controle do Espaço Aéreo (DECEA) liderou a elaboração dos procedimentos de chegada, aproximação e saída para a pista 12 e sua integração à Área de Controle Terminal de São Paulo (TMA-SP). O projeto teve como premissa preservar a capacidade e a</p></div></div><div class="ft"><span>Revista BID · Espaço Aéreo</span><span class="pn">15</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Espaço Aéreo</span></div><div class="bd"><div class="band bgimg" style="height:82mm;background-image:url('img/campo2.jpg')"></div><div class="flow" style="height: 667.125px; flex: 0 0 auto;"><p>regularidade das operações de Congonhas e Guarulhos. Durante 2025, as equipes simularam diferentes volumes de tráfego e avaliaram como encaixar as operações de Campo de Marte no fluxo já administrado pelos controladores.</p><p>Uma das soluções foi estabelecer uma sequência única de chegadas para Campo de Marte e Congonhas. O controle de aproximação organiza os voos destinados aos dois aeroportos em uma mesma fila, aplicando os espaçamentos previstos e coordenando as aproximações de acordo com o destino de cada aeronave. Essa organização permitiu acomodar as chegadas a Marte no fluxo de Congonhas.</p><p>Na fase inicial, as aproximações por instrumentos em Campo de Marte serão realizadas exclusivamente pela cabeceira 12. A operação dependerá do uso simultâneo da cabeceira 17 em Congonhas e da configuração de cabeceiras 10 em Guarulhos. Durante a janela das 6h às 7h, a circulação visual será suspensa nos corredores afetados, mantendo separados o tráfego visual e os voos por instrumentos. A AIC-N 20/26 detalha a implantação do IFR na pista 12, e a AIC-N 29/26 disciplina a circulação visual na terminal de São Paulo e no Vale do Paraíba.</p><h3>O entorno do aeroporto e a preparação da pista</h3><p>O levantamento topográfico para a elaboração do Plano Básico de Zona de Proteção de Aeródromo (PBZPA) identificou mais de 38 mil objetos projetados no espaço aéreo (OPEA). Todos precisaram ser analisados em um estudo aeronáutico complexo, que avaliou sua interferência nas superfícies de proteção e nas trajetórias previstas. A análise permitiu definir as medidas de mitigação para os casos em que foram identificados riscos à operação.</p><p>A elaboração do plano foi o maior desafio da PAX Aeroportos no projeto. Sob a liderança de seu CEO, Rogério Prado, a concessionária executou as obras físicas necessárias e coordenou com o DECEA o trabalho para elaborar o PBZPA. A condução de Rogério Prado foi decisiva para mobilizar as equipes, acompanhar as adequações do aeródromo e manter a articulação com a Aeronáutica. A PAX também dialogou com a Prefeitura de São Paulo sobre os mapas de altitudes associados às superfícies de proteção.</p><p>O Centro Regional de Controle do Espaço Aéreo Sudeste (CRCEA-SE), sob o comando do coronel aviador Luiz Eduardo de França Scovino, teve participação decisiva na avaliação das condições locais e na coordenação com a concessionária. Esse trabalho aproximou o planejamento do DECEA da rotina da torre e das equipes locais, incluindo questões relativas à circulação de aeronaves e veículos no solo e à avaliação do uso de câmeras como apoio à vigilância.</p><p>Outro desafio foi a homologação do Indicador de Trajetória de Aproximação de Precisão (PAPI) da cabeceira 12. O sistema de luzes indica ao piloto se a aeronave está acima, abaixo ou na trajetória adequada de aproximação. Foram necessários vários voos ao longo do processo. Na etapa final, a ASTC realizou voos com um drone de apoio à engenharia para calibrar o PAPI e preparar o equipamento para a inspeção em voo pelo Grupo Especial de Inspeção em Voo (GEIV).</p><p style="text-align-last: justify;">A ASTC adquiriu essa capacidade em um programa de transferência de tecnologia liderado pelo DECEA, com apoio financeiro da Finep. A empresa incorporou a tecnologia, capacitou sua equipe e aplicou o conhecimento adquirido em Campo de Marte. O uso do drone na calibração final mostrou como a transferência de tecnologia</p></div></div><div class="ft"><span>Revista BID · Espaço Aéreo</span><span class="pn">16</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Espaço Aéreo</span></div><div class="bd"><div class="flow last" style="height: auto; flex: 0 0 auto;"><p>pôde atender a uma necessidade concreta da implantação do IFR.</p><h3>Da coordenação institucional à operação assistida</h3><p>A Secretaria Nacional de Aviação Civil (SAC) coordenou as ações no âmbito da política do setor e definiu as diretrizes estratégicas. A Agência Nacional de Aviação Civil (ANAC) acompanhou as adequações e conduziu o processo de alteração cadastral para incorporar o IFR às condições operacionais de Campo de Marte. A implantação reuniu, assim, as adequações aeroportuárias sob responsabilidade da PAX e os procedimentos de navegação e de circulação aérea desenvolvidos pelo DECEA.</p><p>A operação assistida permitirá avaliar, em condições reais, como o procedimento se encaixa na rotina de Campo de Marte e no tráfego da terminal paulista. A janela inicial de uma hora, com quatro slots, dá às equipes uma base para acompanhar o desempenho da operação e avaliar eventuais ajustes. Para a aviação geral, a mudança oferece mais uma alternativa de acesso a São Paulo, com maior previsibilidade dentro das condições operacionais estabelecidas.</p><h3>Reconhecimento a quem tornou a operação possível</h3><p>O autor registra seu agradecimento ao tenente-brigadeiro do ar Marcelo Kanitz Damasceno, comandante da Aeronáutica, e ao tenente-brigadeiro do ar Walcyr Josué de Castilho Araujo, chefe do Estado-Maior da Aeronáutica, pelo apoio institucional. Reconhece a contribuição dos tenentes-brigadeiros do ar Alcides Teixeira Barbacovi e Maurício Augusto Silveira de Medeiros, ex-diretores-gerais do DECEA, pela condução das etapas anteriores, e do tenente-brigadeiro do ar Sérgio Rodrigues Pereira Bastos Junior, atual diretor-geral, pela condução da fase final do planejamento iniciado pela Aeronáutica há mais de dois anos.</p><p>O autor destaca a atuação do coronel França e das equipes do CRCEA-SE, do DECEA e dos órgãos locais de controle de tráfego aéreo. Registra também seu reconhecimento a Rogério Prado e à equipe da PAX Aeroportos pelo empenho nas obras e na elaboração do Plano Básico de Zona de Proteção de Aeródromo.</p><p>Na ANAC, o autor agradece a Tiago Chagas Faierstein, diretor-presidente, e ao brigadeiro Rui Chagas Mesquita, diretor da Agência, pelo acompanhamento do projeto e pelo encaminhamento das etapas regulatórias. Na SAC, reconhece a contribuição do secretário Daniel Ramos Longo e da diretora de Planejamento e Fomento, Júlia Lopes da Silva Nascimento, pela articulação institucional e pelas diretrizes que orientaram a implantação.</p><p>Quando a primeira aeronave utilizar o procedimento, estará colocando em prática uma solução construída para ampliar as opções da aviação geral e preservar a segurança e a capacidade de um espaço aéreo compartilhado por muitos usuários. Essa é a dimensão do trabalho que antecede a primeira hora de operação por instrumentos em Campo de Marte.<span class="end"></span></p></div><div class="fill bgimg" style="background-image:url('img/cockpit.jpg')"></div></div><div class="ft"><span>Revista BID · Espaço Aéreo</span><span class="pn">17</span></div></section><section class="page" data-art="schneider"><div class="hero bgimg" style="height:150mm;background-image:url('img/uav.jpg');background-position:center 50%"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Inovação</span></div>
   <div class="kick">Inovação · Transferência de tecnologia</div><div class="ttl m">UAV4PAPI: da pesquisa aeronáutica à aferição do auxílio visual de aproximação no Campo de Marte</div><div class="deck">Uma tecnologia nascida de uma demanda do DECEA chegou à indústria nacional, foi aperfeiçoada e voltou a servir ao Sistema de Controle do Espaço Aéreo Brasileiro.</div></div>
   <div class="byl"><div class="ph" style=""></div><div><div class="nm">Rubem Müller Schneider</div><div class="cr">Coronel Aviador (RR)</div></div></div>
   <div class="bd" style="padding-top:4mm"><div class="flow" style="height: 419.562px; flex: 0 0 auto;"><p class="drop">Em agosto de 2026, uma aeronave-laboratório do Grupo Especial de Inspeção em Voo (GEIV) retornou ao Aeroporto Campo de Marte, em São Paulo. Desde janeiro, o Grupo já havia dedicado sucessivas campanhas e mais de uma dezena de horas de voo à tentativa de homologar o auxílio visual de aproximação da cabeceira 12. Os obstáculos no entorno do aeródromo haviam exigido uma rampa excepcionalmente inclinada e uma cobertura lateral assimétrica. A dificuldade de verificar essa configuração em voo vinha retardando os ensaios e o processo de homologação do auxílio pela Agência Nacional de Aviação Civil (ANAC). Naquelas condições, uma nova campanha precisava de evidências de que a regulagem havia melhorado. Essa base técnica veio das medições realizadas com o UAV4PAPI e apresentadas ao Subdepartamento de Operações do Departamento de Controle do Espaço Aéreo (DECEA). Com uma aeronave remotamente pilotada, foi possível orientar os ajustes nas unidades luminosas e verificar seus efeitos antes do retorno da aeronave-laboratório.</p><h3>Como funciona o PAPI</h3><p>O auxílio visual da cabeceira 12 é o PAPI, sigla em inglês para Indicador de Trajetória de Aproximação de Precisão. Durante a aproximação para o pouso, a combinação de luzes brancas e vermelhas indica ao piloto a posição da aeronave em relação à rampa prevista. Duas luzes brancas e duas vermelhas indicam que a aeronave está na faixa correta. Abaixo da rampa, predominam as vermelhas. Acima dela, predominam as brancas. Cada unidade luminosa apresenta uma transição de cor em um ângulo próprio. A regulagem desses ângulos define a orientação vertical do auxílio, enquanto a cobertura lateral determina os setores da aproximação em que o piloto consegue ver as indicações.</p><div class="papi"><div class="pt">Como o piloto lê o PAPI</div>
      <div class="row"><span class="lt"><i class="w"></i><i class="w"></i><i class="w"></i><i class="w"></i></span>Muito acima da rampa</div>
      <div class="row"><span class="lt"><i class="w"></i><i class="w"></i><i class="w"></i><i class="r"></i></span>Ligeiramente acima</div>
      <div class="row"><span class="lt"><i class="w"></i><i class="w"></i><i class="r"></i><i class="r"></i></span><b style="color:#fff">Na rampa correta</b></div>
      <div class="row"><span class="lt"><i class="w"></i><i class="r"></i><i class="r"></i><i class="r"></i></span>Ligeiramente abaixo</div>
      <div class="row" style="margin:0"><span class="lt"><i class="r"></i><i class="r"></i><i class="r"></i><i class="r"></i></span>Muito abaixo da rampa</div></div></div></div><div class="ft"><span>Revista BID · Inovação</span><span class="pn">18</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Inovação</span></div><div class="bd"><div class="band bgimg" style="height:82mm;background-image:url('img/drone2.jpg')"></div><div class="flow" style="height: 667.125px; flex: 0 0 auto;"><h3>Da pesquisa à metodologia</h3><p>Anos antes da aplicação em Campo de Marte, o DECEA já estudava o uso de aeronaves não tripuladas para aferir auxílios visuais antes da inspeção em voo. A proposta respondia a uma meta interna do Programa SIRIUS, do próprio Departamento, que buscava reduzir a carga de trabalho durante as inspeções, mitigar seu impacto sobre o fluxo de tráfego aéreo e diminuir o esforço aéreo anual do GEIV no atendimento ao Sistema de Controle do Espaço Aéreo Brasileiro (SISCEAB). A inspeção oficial continuaria a cargo do Grupo, que receberia o auxílio previamente aferido e ajustado. Com essa preparação, esperava-se reduzir ao mínimo a necessidade de ajustes durante a missão e, consequentemente, o número de passagens adicionais para conferir as correções.</p><p>Em 2019, por iniciativa do DECEA, uma portaria reuniu três organizações do Comando da Aeronáutica para conduzir o estudo. O Instituto de Controle do Espaço Aéreo (ICEA) e o GEIV, ambos do DECEA, trabalharam com o Instituto de Estudos Avançados (IEAv), do Departamento de Ciência e Tecnologia Aeroespacial (DCTA). Entre 2019 e 2021, as três organizações realizaram 13 campanhas de desenvolvimento e testes, abrangendo 11 instalações de PAPI. O trabalho mobilizou aeronaves-laboratório, pilotos inspetores, operadores de sistemas de inspeção em voo, equipes de manutenção, engenheiros, desenvolvedores de sistemas e especialistas em topografia, cartografia e processamento de imagens. As equipes planejaram os ensaios, levantaram os dados de cada instalação e compararam as medições do drone com as obtidas pelos meios empregados nas inspeções oficiais. Desse esforço resultaram uma metodologia de aferição e um programa de computador desenvolvido pelo IEAv e registrado no Instituto Nacional da Propriedade Industrial (INPI).</p><h3>Do TRL 3 ao TRL 9</h3><p>Concluída a etapa de pesquisa, o Comando da Aeronáutica disponibilizou a tecnologia para transferência à iniciativa privada. Naquele momento, a solução encontrava-se no nível de maturidade tecnológica TRL 3, correspondente à demonstração experimental de seu conceito, e ainda exigia amplo desenvolvimento para se tornar um produto apto ao emprego operacional. Ao identificar seu potencial, a Araújo Santos Tecnologias Críticas (ASTC), de São José dos Campos, foi a primeira empresa a procurar o Comando da Aeronáutica, junto ao Estado-Maior da Aeronáutica (EMAER), manifestar interesse na tecnologia e solicitar e obter a qualificação necessária para recebê-la. Em 2025, a formalização do licenciamento do software e da transferência do conhecimento técnico acumulado nos ensaios integrou as primeiras transferências de tecnologia da história do DECEA. A partir dessa base, a ASTC realizou os desenvolvimentos e aperfeiçoamentos necessários para levar a solução ao TRL 9, nível em que seu funcionamento é comprovado em condições reais de operação, alcançado com a aplicação no Aeroporto Campo de Marte. Esse percurso ocorreu no âmbito do Sistema de Inovação da Aeronáutica, que tem o DCTA como órgão central e segue as orientações de governança do EMAER.</p></div></div><div class="ft"><span>Revista BID · Inovação</span><span class="pn">19</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Inovação</span></div><div class="bd"><div class="flow" style="height: 994.031px; flex: 0 0 auto;"><div class="tl"><div><b>2019</b>Portaria do DECEA reúne ICEA, GEIV e IEAv para o estudo</div><div><b>2019–2021</b>13 campanhas de testes em 11 instalações de PAPI</div><div><b>2025</b>Licenciamento do software e transferência de tecnologia à ASTC</div><div><b>Jun 2025</b>ICEA inicia a análise de conformidade do UAV4PAPI</div><div><b>Ago 2026</b>Nova campanha do GEIV no Campo de Marte, com medições praticamente idênticas às do UAV4PAPI</div></div><p>Esse percurso tem amparo no marco federal de ciência, tecnologia e inovação. A Lei nº 10.973, de 2004, alterada pela Lei nº 13.243, de 2016, e regulamentada pelo Decreto nº 9.283, de 2018, prevê a transferência de tecnologia e o licenciamento de criações desenvolvidas por instituições científicas e tecnológicas públicas. No âmbito dessa política, o Ministério da Ciência, Tecnologia e Inovação acompanha a gestão da propriedade intelectual e as atividades de transferência de tecnologia dessas instituições. No caso do UAV4PAPI, os contratos permitem à ASTC aperfeiçoar e explorar comercialmente a solução e estabelecem mecanismos de fiscalização, prestação de informações sobre sua evolução e pagamento de royalties ao Comando da Aeronáutica. A experiência obtida em campo e a remuneração contratual são duas formas de retorno da aplicação comercial à administração pública.</p><h3>Visão computacional a serviço da aferição</h3><p>A experiência da equipe da ASTC em inspeções com aeronaves não tripuladas foi um dos fatores que credenciaram a empresa no processo de seleção para a transferência de tecnologia. Seus profissionais já haviam desenvolvido projetos que envolviam operações além do alcance visual do piloto remoto (BVLOS) e aplicado técnicas de visão computacional à detecção e à classificação de corrosão em estruturas metálicas de instalações de óleo e gás, inclusive em plataformas marítimas. Esses trabalhos exigiam planejar a coleta de imagens, localizar cada ocorrência e extrair dos registros informações úteis para a manutenção.</p><p>Essa experiência permitiu à ASTC incorporar ao UAV4PAPI um de seus principais diferenciais, a identificação automatizada das transições de cor das luzes do PAPI. Com técnicas de visão computacional e inteligência artificial, o software analisa as imagens captadas pelo drone, identifica a passagem do branco para o vermelho em cada unidade luminosa e determina o ângulo correspondente. A aplicação do mesmo critério a todas as imagens reduz a dependência da interpretação visual do avaliador e torna essa etapa da aferição mais repetível.</p><h3>Análise de conformidade</h3><p>Os auxílios visuais de aproximação são tratados no Anexo 14 da Organização da Aviação Civil Internacional (OACI). No âmbito do SISCEAB, a aferição desses auxílios com aeronaves não tripuladas, por si só, dispensa o enquadramento da ferramenta empregada como Produto de Controle do Espaço Aéreo (PCEA) e, consequentemente, a aplicação dos requisitos de qualidade e certificação associados a essa classificação.</p><p>No caso do UAV4PAPI, a ASTC apresentou o RSAC (Requerimento de Serviço de Análise de Conformidade) e os Subdepartamentos de Operações e Técnico do DECEA entenderam que este produto em particular deveria ser tratado como PCEA e submetido à análise de conformidade. A decisão levou em conta o fato de que o projeto nasceu de uma demanda do próprio DECEA e foi desenvolvido com a participação de equipes do Departamento e do DCTA. Essa origem permitia reconstituir as decisões de projeto e os resultados dos ensaios a partir dos registros e da experiência dos profissionais envolvidos, fornecendo ampla rastreabilidade ao processo. Para o ICEA, a avaliação também oferecia a oportunidade de aprimorar métodos aplicáveis a outros sistemas do SISCEAB e de estabelecer cooperação com laboratórios externos, ampliando a capacidade de ensaio. O potencial de evolução da ferramenta no curto e no médio prazo também pesou nesse enquadramento. Nesse contexto, o ICEA conduz, desde junho de 2025, a análise de conformidade do UAV4PAPI.</p><h3>A aplicação em Campo de Marte</h3><p>Diante das dificuldades para homologar o PAPI da cabeceira 12, a PAX Aeroportos, concessionária responsável pela administração e pela operação de Campo de Marte, tomou conhecimento de que a ASTC dispunha de uma ferramenta capaz de aferir o auxílio e fornecer dados que justificassem uma nova campanha de inspeção em voo. Saber que o UAV4PAPI estava sendo submetido à análise de conformidade no ICEA encorajou a concessionária a procurar a ASTC e a contratar seus serviços.</p><p>Em Campo de Marte, as aferições com a aeronave não tripulada orientaram os ajustes nas unidades luminosas e permitiram verificar seus efeitos. Os resultados mostraram que a regulagem havia melhorado e deram ao GEIV base técnica para retornar ao aeródromo. Na nova campanha, as medições da aeronave-laboratório foram praticamente idênticas às do UAV4PAPI nos parâmetros comparados. A aplicação da tecnologia foi decisiva para retomar a inspeção em voo e fazer avançar o processo de homologação do auxílio.</p></div></div><div class="ft"><span>Revista BID · Inovação</span><span class="pn">20</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Inovação</span></div><div class="bd"><div class="flow last" style="height: auto; flex: 0 0 auto;"><p>A homologação do PAPI da cabeceira 12 integra a preparação de Campo de Marte para operar sob Regras de Voo por Instrumentos (IFR), uma mudança há muito aguardada pela comunidade aeronáutica. Uma vez implementados os procedimentos elaborados pelo DECEA, o aeródromo poderá receber voos em condições meteorológicas que hoje limitam as operações visuais, observados os mínimos aplicáveis. Para os usuários, isso significa maior previsibilidade nas chegadas e nas partidas. Para a rede aeroportuária, amplia as opções da aviação geral na Região Metropolitana de São Paulo e cria condições para que Campo de Marte absorva parte do tráfego que hoje utiliza Congonhas. Em uma das áreas terminais mais movimentadas do país, essa possibilidade permite aproveitar melhor a infraestrutura existente e distribuir o tráfego entre os aeródromos de acordo com o perfil de cada operação.</p><h3>O ciclo completo da inovação</h3><p>Após a contratação pela PAX Aeroportos e a execução dos serviços pela ASTC no Aeroporto Campo de Marte, em São Paulo, os royalties devidos pela exploração comercial da tecnologia foram recolhidos ao Comando da Aeronáutica, conforme previsto no contrato de transferência de tecnologia firmado pela empresa. O recolhimento completou, nessa primeira aplicação comercial, o ciclo iniciado com uma demanda operacional do DECEA. A pesquisa conduzida por organizações do Comando da Aeronáutica gerou uma metodologia e um software registrado. A transferência levou esse conhecimento à indústria nacional, que o aperfeiçoou e o aplicou em uma situação real. A prestação do serviço, por sua vez, produziu resultados operacionais e gerou a remuneração prevista para a administração pública.</p><p>Para o DECEA, a experiência de Campo de Marte mostra como a aferição prévia pode ajudar o GEIV a planejar suas missões com dados sobre a condição do auxílio e reduzir a necessidade de passagens voltadas a ajustes e novas verificações. Para o país, o caso mostra como a pesquisa aeronáutica pública pode fortalecer a capacidade da indústria nacional de desenvolver e oferecer serviços especializados. A tecnologia criada a partir de uma necessidade do controle do espaço aéreo voltou a atender a esse mesmo sistema, já aperfeiçoada pela indústria e com resultados que ajudam a orientar seu emprego em outras instalações de PAPI.<span class="end"></span></p></div><div class="fill bgimg" style="background-image:url('img/papi2.jpg')"></div></div><div class="ft"><span>Revista BID · Inovação</span><span class="pn">21</span></div></section><section class="page" data-art="sagille"><div class="hero bgimg" style="height:150mm;background-image:url('img/rafis.jpg');background-position:center 50%"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Tráfego Aéreo</span></div>
   <div class="kick">Tráfego Aéreo · Torres remotas</div><div class="ttl m">R-AFIS e EMS-R: inovação na prestação de serviços de informação de voo em múltiplas localidades</div><div class="deck">A prova de conceito do Centro Regional de Sorocaba mostrou que um único operador pode atender, à distância, mais de um aeródromo de baixo movimento, com observação meteorológica remota.</div></div>
   <div class="byl"><div class="ph" style=""></div><div><div class="nm">Felipe do Souto de Sá Gille e Ary Rodrigues Bertolino</div><div class="cr">Consultores da Saipher</div></div></div>
   <div class="bd" style="padding-top:4mm"><div class="flow" style="height: 419.562px; flex: 0 0 auto;"><p class="lead">Este artigo explora a experiência pioneira da SAIPHER, da Rede VOA e da PAIM com o DECEA no desenvolvimento do R-AFIS e da EMS-R durante a implantação do Centro Regional de Sorocaba.</p><p class="drop">Um país com dimensões continentais como o Brasil, com uma malha rodoviária em condições precárias e com a malha ferroviária praticamente inexistente, tem na aviação, em muitos locais, a única opção de acesso. Essa consideração, somada ao tamanho da frota brasileira e às principais atividades econômicas de cada estado, dá algumas pistas sobre a quantidade de aeródromos existentes e necessários no Brasil para o devido atendimento às diversas demandas financeiras e econômicas nacionais.</p><p>Em nosso país, segundo dados da ANAC de 2020, existem 2.752 aeródromos espalhados por todos os estados da federação. Desse total, 569 são públicos e 2.183 privados, sem contar os 1.228 helipontos registrados. A título de comparação, nos Estados Unidos existem 19.636 aeródromos registrados, entre públicos e privados. Desse total, existem apenas 60 aeródromos com operação IFR, onde é prestado o serviço de controle de tráfego aéreo por uma Torre de Controle. Nos demais aeródromos há somente a prestação de serviço de informação de voo, por meio do Aerodrome Flight Information Service (AFIS). O fluxo de tráfego aéreo nos aeródromos brasileiros apresenta-se de forma concentrada; assim, percentual expressivo dos aeródromos possui baixo volume de tráfego. Entretanto, torna-se imprescindível um elevado investimento em equipamentos e pessoal para atender o tráfego aéreo e os níveis de segurança que a aviação exige.</p><div class="stats"><div><b>2.752</b>aeródromos no Brasil (ANAC, 2020)</div><div><b>569</b>aeródromos públicos</div><div><b>2.183</b>aeródromos privados</div><div><b>1.228</b>helipontos registrados</div></div><p style="text-align-last: justify;">A crescente demanda por serviços eficientes e sustentáveis na aviação geral brasileira impulsionou a busca por</p></div></div><div class="ft"><span>Revista BID · Tráfego Aéreo</span><span class="pn">22</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Tráfego Aéreo</span></div><div class="bd"><div class="band bgimg" style="height:82mm;background-image:url('img/mastro.jpg')"></div><div class="flow" style="height: 667.125px; flex: 0 0 auto;"><p>soluções inovadoras de gestão do tráfego aéreo em aeródromos com baixo volume de operações (até 30.000 movimentos anuais).</p><p>Dessa forma, o Remote Aerodrome Flight Information Service (R-AFIS), associado ao Total Air Traffic Information Control (TATIC®), surge como uma alternativa tecnológica viável para serviços de informação de voo a partir de centros remotos. Quando o aeródromo não possuir uma Estação Meteorológica de Superfície Automática (EMS-A), prevê-se ainda a criação e a implantação de uma Estação Meteorológica de Superfície Remota (EMS-R), para que o operador do R-AFIS possa realizar a observação à superfície, com a mesma qualidade, à distância, como se estivesse no órgão ATS localizado no aeródromo.</p><p>Este projeto, iniciado em julho de 2023, apresenta os resultados da prova de conceito, coordenada pelo DECEA e iniciada em junho de 2024, do sistema R-AFIS implementado no Centro Regional de Sorocaba (SDCO), com a operação remota dos aeródromos de Campo dos Amarais (SDAM) e Franca (SDFN). O projeto também incluiu a implantação de um sistema de EMS-R, com operação baseada em câmeras e sensores automáticos. Um único operador controla e gerencia, simultaneamente, os aeródromos de Campo dos Amarais e Franca a partir do Centro Regional de Sorocaba, o que representa um marco para a transformação digital dos serviços de tráfego aéreo no Brasil.</p><p>O estudo também destaca os desafios enfrentados durante o desenvolvimento do projeto, a capacitação das equipes env
