olvidas e as soluções técnicas implementadas para garantir a eficiência e a segurança da operação remota. Os resultados obtidos oferecem uma base sólida para futuras expansões do modelo em outros aeródromos brasileiros. O objetivo final é que um único operador consiga operar e controlar até quatro aeródromos ao mesmo tempo.</p><h3>O R-AFIS, o TATIC® e sua aplicação no Brasil</h3><p>O R-AFIS é uma evolução do tradicional Serviço de Informação de Voo de Aeródromo (AFIS), permitindo que um operador forneça informações essenciais para a segurança operacional em aeródromos remotos sem a necessidade de presença física. Neste projeto, o R-AFIS é complementado pelo TATIC®, que consiste em:</p><div class="ilist"><div class="it"><div><strong>Strips eletrônicas (EFPS)</strong>Substituição das convencionais strips (fichas) de papel por strips eletrônicas, as Electronic Flight Progress Strips. Elas contêm informações operacionais de um plano de voo e são digitalmente distribuídas entre as várias posições operacionais, criando padronização e organização automática da informação e evitando o uso de grande volume de papel.</div></div><div class="it"><div><strong>Módulos integrados</strong>Ao operar de maneira integrada, os módulos do TATIC® Suite fazem com que a informação criada em um sistema esteja imediatamente disponível aos demais, transitando de forma automática e instantânea. Uma informação originada em uma torre de controle é disponibilizada de imediato no módulo ATIS, AIS ou mesmo em um ACC ou APP</div></div><div class="it"><div><strong> um plano de voo inserido no módulo AIS cria uma strip na torre de controle, e assim sucessivamente.</strong>undefined</div></div></div><p>Essas informações também podem ser compartilhadas com outros sistemas, em tempo real ou não, fornecendo dados de extrema relevância para faturamento, estatísticas e gerenciamento ATFM (Air Traffic Flow Management).</p></div></div><div class="ft"><span>Revista BID · Tráfego Aéreo</span><span class="pn">23</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Tráfego Aéreo</span></div><div class="bd"><div class="flow" style="height: 994.031px; flex: 0 0 auto;"><h3>A EMS-R e sua homologação pelo DECEA</h3><p>As EMS-R devem ser empregadas em aeródromos em que exista a necessidade de prestação do serviço, cuja receita dificulte a manutenção de uma EMS automática ou cuja localidade apresente dificuldades logísticas para apoio ao homem. Cada EMS-R será provida de sistema de câmeras de visualização de alta definição, capaz de prover ao Observador Meteorológico (OBM) a visão da totalidade do aeródromo, principalmente dos pontos contidos na Carta de Visibilidade, sem pontos cegos. Obrigatoriamente, deverão ser implantados os equipamentos e instrumentos previstos no item 2.7, Infraestrutura Operacional, da ICA 105-15/2021, Estações Meteorológicas de Superfície, do DECEA, além de um limpador de lente acionado à distância pelo OBM quando necessário.</p><p>Quando a localidade registrar valores abaixo de 10 graus Celsius, a câmera também deverá dispor de um sistema de aquecimento a fim de evitar a condensação nas lentes. Seu sistema de zoom deve ser igual ou superior a 10x, sem distorção de imagem, e o sistema de câmeras não poderá perder resolução em situações de baixa nebulosidade. É desejável que esse sistema seja acrescido de imagem sintética que auxilie na identificação de incursão de pista de aeronaves, veículos, pessoas ou animais. O sistema de transmissão de dados da EMS-R ao Centro deverá suportar, sem atrasos e interrupções, a transmissão de dados de todos os sistemas instalados, bem como ter capacidade de automonitoramento, a fim de prover ao OBM informações em tempo real.</p><p>Além das câmeras, foram instalados um sensor de descarga atmosférica, para a identificação de nuvens do tipo Cumulonimbus (CB) quando estiverem embutidas em outras nuvens, e um pluviômetro.</p><p>Fator crucial na operação da EMS-R é a participação do componente humano, mesmo que por meio de câmeras, para determinar com a precisão necessária as condições meteorológicas reinantes em um determinado aeródromo. Toda essa tecnologia foi implantada na cidade de Sorocaba, São Paulo, e está sendo avaliada pelo DECEA para homologação.</p><h3>Metodologia</h3><p>A Prova de Conceito (Proof of Concept, POC), estabelecida pelo DECEA, foi estruturada com base em critérios técnicos, operacionais e regulatórios, compreendendo três fases principais: análise e seleção dos aeródromos remotos; instalação da infraestrutura técnica de comunicação, sensores e câmeras; e avaliação em ambiente real de operação, com acompanhamento de especialistas em controle de tráfego aéreo, meteorologia e tecnologia da informação. A seleção de Campo dos Amarais e Franca considerou critérios como volume de tráfego, ausência de serviço AFIS local e viabilidade técnica para instalação dos equipamentos. Foram utilizados enlaces dedicados de comunicação, servidores redundantes e equipamentos de videomonitoramento com padrão ICAO. A operação experimental seguiu protocolos definidos em conjunto com a equipe do DECEA e com o suporte das autoridades locais dos aeródromos.</p><p>A operação durante a POC, em uma parceria de múltiplos interesses, trouxe ao DECEA a oportunidade de analisar esse avanço em um cenário de operação real e controlada, monitorando o desempenho de operadores, equipamentos e bases normativas, a fim de promover a melhor alteração regulatória que atenda aos princípios da segurança das operações, do uso mais racional do recurso disponível e da utilização da tecnologia já existente. Para o cenário da POC, foi desenvolvido ainda um robusto Plano de Degradação, voltado ao treinamento dos operadores quanto à reinicialização de todos os sistemas utilizados, a fim de preparar o cenário futuro para a operação real.</p><h3>Resultados</h3><p>O desenvolvimento e a implantação das EMS-R foram fundamentais para a POC, tendo em vista que a EMS-R é um conceito totalmente novo, que não existe em nenhum lugar do mundo. Inicialmente, foram realizadas diversas análises, tendo como universo mais de 2.800 observações realizadas tanto localmente, no Aeroporto de Campo dos Amarais, quanto remotamente, no Centro Regional de Sorocaba, no mesmo horário, no período de 25 de julho de 2023 a 31 de março de 2024. Essas observações foram comparadas e analisadas.</p><p>A instalação de um aplicativo, em 17 de setembro de 2023, para correção dos problemas de internet e travamento de câmeras contribuiu para a diminuição do percentual de panes de 15,2% para 11,4%; na Fase 3, para 4,6%; para 0% nas Fases 4 e 5; 0,5% na Fase 6; e 0% na Fase 7.</p><div class="bars"><div class="bt">Percentual de panes por fase da prova de conceito</div><div class="br"><span>Antes</span><i style="width:42mm"></i><em>15,2%</em></div><div class="br"><span>Após app</span><i style="width:31.500000000000004mm"></i><em>11,4%</em></div><div class="br"><span>Fase 3</span><i style="width:12.710526315789474mm"></i><em>4,6%</em></div><div class="br"><span>Fase 4</span><i style="width:1mm"></i><em>0%</em></div><div class="br"><span>Fase 5</span><i style="width:1mm"></i><em>0%</em></div><div class="br"><span>Fase 6</span><i style="width:1.381578947368421mm"></i><em>0,5%</em></div><div class="br"><span>Fase 7</span><i style="width:1mm"></i><em>0%</em></div></div><p style="text-align-last: justify;">A quantidade de observações realizadas apresentou uma amostra significativa, de bom e mau tempo, necessária para a comparação e análise entre as observações</p></div></div><div class="ft"><span>Revista BID · Tráfego Aéreo</span><span class="pn">24</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Tráfego Aéreo</span></div><div class="bd"><div class="flow" style="height: 994.031px; flex: 0 0 auto;"><p>local e remota. O tempo gasto pelo operador na realização da observação é compatível com três a quatro observações dentro do tempo previsto pela OMM e pelo DECEA. O número de discrepâncias entre as observações foi extremamente pequeno, e o ligeiro aumento ocorrido na Fase 7 se deveu ao treinamento inicial de dois operadores que farão parte da equipe responsável pela operação da primeira EMS-R.</p><p>Considerando os resultados apresentados, conclui-se que as EMS remotas instaladas se mostraram plenamente funcionais, gerando boletins meteorológicos eficientes e eficazes e transmitindo dados em tempo real para o banco de dados do DECEA (Banco OPMET) e para a estação R-AFIS. Câmeras com capacidade de zoom, rotação e visão noturna possibilitaram a avaliação visual da pista e das condições atmosféricas locais.</p><p>Em relação ao R-AFIS, a operação remota foi iniciada com voos assistidos de validação e acompanhamento técnico. Foram registrados mais de 200 movimentos aéreos em condições VFR nos aeródromos de Campo dos Amarais e Franca, sob a supervisão da unidade R-AFIS instalada em Sorocaba. Durante o período de testes, a taxa de eficiência na comunicação e no fornecimento de informações aos pilotos foi de 100%, sem relatos de falhas. Os operadores, após o treinamento adequado, relataram facilidade na adaptação à nova configuração operacional. As imagens transmitidas em tempo real, associadas aos dados meteorológicos automatizados, proporcionaram elevado grau de consciência situacional.</p><div class="stats"><div><b>2.800+</b>observações locais e remotas comparadas</div><div><b>200+</b>movimentos VFR sob supervisão remota</div><div><b>100%</b>de eficiência nas comunicações</div><div><b>&lt; 5 s</b>de tempo médio de resposta</div></div><p>Dados estatísticos coletados durante a prova de conceito indicaram consistência na prestação do serviço, com tempo médio de resposta inferior a 5 segundos em todas as comunicações. Durante a prova de conceito, o DECEA realizou diversas visitas técnicas de acompanhamento, abrangendo as áreas de meteorologia e de prestação do serviço AFIS. Nesse período, foram conduzidas simulações com aumento progressivo da carga de trabalho na fonia entre pilotos e operadores do R-AFIS, para avaliar a capacidade de resposta dos operadores à comunicação simultânea com múltiplas aeronaves e sua habilidade de manter a regularidade e a precisão das observações meteorológicas sob maior demanda. Como resultado, obteve-se um tempo médio de geração de observação meteorológica de dois minutos e trinta segundos, com índice de semelhança entre as observações local e remota superior a 90%.</p><h3>Discussão</h3><p>A implementação do R-AFIS trouxe ganhos operacionais relevantes, sobretudo na racionalização de recursos humanos e na ampliação da cobertura de serviços de informação de voo em regiões com menor densidade de tráfego aéreo. A experiência de Sorocaba pode servir como modelo para a replicação em outros centros regionais, fortalecendo o conceito de torres remotas e de gestão integrada de aeródromos. O sucesso do projeto também dependeu da interoperabilidade entre os sistemas da SAIPHER e a infraestrutura de TI da Rede VOA. Outro aspecto relevante foi o envolvimento de operadores experientes na fase de testes, garantindo feedback contínuo e ajustes operacionais durante as simulações iniciais.</p><p>A integração com a EMS remota garantiu confiabilidade meteorológica para apoio à navegação visual, alinhando-se às práticas já consolidadas em países europeus. O sistema também contribui para maior segurança operacional, ao proporcionar consciência situacional ao operador R-AFIS em tempo real. Entre os principais benefícios do projeto, destaca-se a racionalização dos recursos humanos, com a centralização dos operadores em cidades com maior estrutura de apoio, promovendo qualidade de vida e suporte logístico. Outro ponto relevante é a redução dos custos de investimento, uma vez que o modelo permite a operação com EMS-R, eliminando a necessidade de aquisição de EMS-A, cujo custo é significativamente superior. Essa abordagem viabiliza que diversos aeródromos hoje sem serviço AFIS passem a contar com apoio remoto, contribuindo diretamente para a consciência situacional dos pilotos e, por consequência, para a segurança das operações.</p><p>Entre as vantagens da criação do Centro Regional de R-AFIS e EMS-R, destacam-se:</p></div></div><div class="ft"><span>Revista BID · Tráfego Aéreo</span><span class="pn">25</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Tráfego Aéreo</span></div><div class="bd"><div class="flow last" style="height: auto; flex: 0 0 auto;"><div class="ilist"><div class="it"><div><strong>Economia de recursos</strong>A concentração em uma única instalação de vários R-AFIS e EMS-R, provenientes de vários aeródromos, reparte as despesas entre todas as administrações aeroportuárias atendidas pelo Centro.</div></div><div class="it"><div><strong>Redução de pessoal</strong>Se cada estação do Centro for responsável por três AFIS e EMS-R, a redução de recursos humanos fica na faixa de 66%.</div></div><div class="it"><div><strong>Áreas de difícil acesso</strong>Possibilidade de operação em locais remotos com custos de aquisição menores que os de uma EMS automática.</div></div><div class="it"><div><strong>Baixa infraestrutura</strong>Possibilidade de operação em locais com baixo nível de infraestrutura disponível.</div></div><div class="it"><div><strong>Contingência</strong>A EMS-R pode servir como alternativa de contingência, menos custosa que uma EMS automática, inclusive em aeródromos de médio e alto movimento.</div></div><div class="it"><div><strong>Escala</strong>Possibilidade de operação de diversos AFIS e EMS-R por um único Centro Regional.</div></div></div><p>É importante frisar que o custo de instalação inicial em áreas remotas pode ser bastante alto, tendo em vista a necessidade de infraestrutura de rede de transmissão de dados de alta capacidade para suportar a operação remota de todos os sistemas que compõem o AFIS e a EMS e sua implementação no Centro.</p><h3>Conclusão</h3><p>O projeto do Centro Regional de R-AFIS e EMS-R de Sorocaba representa um avanço significativo na modernização da prestação de serviços de informação de voo em aeródromos de baixo movimento. Ao permitir que um único operador gerencie múltiplas localidades, mantendo o número total de movimentos abaixo do limite para ativação de uma torre de controle, o modelo otimiza custos, melhora a eficiência operacional e amplia a cobertura do serviço AFIS.</p><p>A prova de conceito em Sorocaba demonstra a viabilidade técnica e operacional de serviços remotos de informação de voo e de monitoramento meteorológico. O sucesso da operação nos aeródromos de Campo dos Amarais e Franca abre caminho para a adoção de um modelo escalável, com potencial para modernizar a infraestrutura ATM brasileira e otimizar a prestação de serviços aeronáuticos em aeródromos regionais. O uso combinado de videomonitoramento, sensoriamento remoto e comunicação digital demonstrou ser uma alternativa robusta para a ampliação dos serviços em localidades com baixa densidade operacional. A continuidade do projeto requer a definição de regulamentações específicas e a capacitação contínua dos operadores.<span class="end"></span></p><div class="refs"><b>Referências</b><div>DECEA. Homologação, Ativação e Desativação no âmbito do SISCEAB, MCA 63-4. Rio de Janeiro, 2017.</div><div>DECEA. Manual de Instalação de Estações Meteorológicas de Superfície e de Altitude, MCA 101-1. Rio de Janeiro, 2018.</div><div>DECEA. Modelo Operacional e Manual do Órgão AFIS, MCA CIRCEA 102-4. Rio de Janeiro, 2020.</div><div>DECEA. Procedimentos Relativos ao Intercâmbio de Informações Meteorológicas entre os Órgãos MET, ATS, SAR e AIS, CIRCEA 63-1. Rio de Janeiro, 2020.</div><div>DECEA. Estações Meteorológicas de Superfície, ICA 105-15. Rio de Janeiro, 2021.</div><div>DECEA. Horário de Trabalho do Pessoal ATC, COM, MET, AIS e OPM, ICA 63-33. Rio de Janeiro, 2023.</div><div>OACI. Manual on Remote ATS, Doc 10119. Montreal, 2020.</div><div>OMM. Serviço Meteorológico para a Navegação Aérea Internacional, Anexo 3, 20ª ed. 2018.</div><div>SÁ GILLE, F. S. S.; BERTOLINO, A. R. Centro Regional de Estações Meteorológicas de Superfície Remota. XXXIII Congresso Brasileiro de Meteorologia, 2024.</div><div>SÁ GILLE, F. S. S.; BERTOLINO, A. R. Centro Regional de Estações Meteorológicas de Superfície Remota. XXII SITRAER, 2025.</div></div></div><div class="fill bgimg" style="background-image:url('img/regional.jpg')"></div></div><div class="ft"><span>Revista BID · Tráfego Aéreo</span><span class="pn">26</span></div></section><section class="page" data-art="benevides"><div class="hero bgimg" style="height:150mm;background-image:url('img/marica.jpg');background-position:center 45%"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Aviação e Sociedade</span></div>
   <div class="kick">Aviação e Sociedade · Maricá (RJ)</div><div class="ttl s">Maricá aproveita oportunidades no setor de aviação para desenvolver projetos sociais, profissionais e de inclusão</div><div class="deck">O programa Voar é Para Todos leva jovens da rede pública à licença de piloto comercial com IFR e multimotor, ou à formação de mecânico de aeronaves, em um a dois anos.</div></div>
   <div class="byl"><div class="ph" style=""></div><div><div class="nm">Rogério Benevides Carvalho</div><div class="cr">Diretor de Assuntos Aeroviários da CODEMAR · Maricá (RJ), novembro de 2026</div></div></div>
   <div class="bd" style="padding-top:4mm"><div class="flow" style="height: 419.562px; flex: 0 0 auto;"><p class="lead">A aviação civil e o transporte aéreo constituem setores estratégicos de alta complexidade tecnológica, rigor regulatório e elevado potencial de geração de renda. Historicamente, contudo, o ingresso nas carreiras operacionais e técnicas da aeronáutica, sobretudo na pilotagem e na manutenção de aeronaves, permaneceu restrito a parcelas economicamente privilegiadas da população, em razão dos elevados custos da instrução teórica e, principalmente, das horas de voo exigidas para a certificação profissional. Diante desse cenário, o Município de Maricá (RJ), por meio da Companhia de Desenvolvimento de Maricá (CODEMAR) e da Secretaria Municipal de Educação, estruturou uma política pública disruptiva que articula a expansão da infraestrutura aeroportuária local à democratização do acesso à formação aeronáutica.</p><h3>A assimetria histórica de acesso na aviação civil</h3><p class="drop">O transporte aéreo moderno desempenha papel insubstituível na integração territorial, no escoamento de cargas de alto valor agregado, no suporte às cadeias produtivas de óleo e gás <i>offshore</i> e no fomento ao turismo. Apesar de sua relevância socioeconômica crescente, a estrutura ocupacional da aviação civil brasileira carrega uma marca histórica de seletividade socioeconômica. Diferentemente de outras carreiras técnicas ou superiores, em que o ensino público gratuito consolidou mecanismos amplos de ascensão social ao longo das últimas décadas, a formação de tripulantes técnicos e profissionais de manutenção aeronáutica permaneceu majoritariamente dependente do financiamento privado direto pelas famílias.</p><p style="text-align-last: justify;">Essa barreira de entrada não decorre de falta de aptidão ou interesse da juventude das camadas populares, mas da própria natureza regulatória e operacional da atividade aérea. A segurança operacional (<i>safety</i>) exige padrões internacionais rigorosos estabelecidos pela Organização da Aviação Civil Internacional (OACI/ICAO) e</p></div></div><div class="ft"><span>Revista BID · Aviação e Sociedade</span><span class="pn">27</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Aviação e Sociedade</span></div><div class="bd"><div class="band bgimg" style="height:82mm;background-image:url('img/mecanicos.jpg')"></div><div class="flow" style="height: 667.125px; flex: 0 0 auto;"><p>fiscalizados no Brasil pela Agência Nacional de Aviação Civil (ANAC). Tais exigências demandam infraestrutura especializada, simuladores, aeronaves de instrução homologadas, combustível de aviação, manutenção permanente e Centros de Instrução de Aviação Civil (CIACs) certificados.</p><p>Ao observar a vocação estratégica de Maricá, impulsionada pela operação logística <i>offshore</i> no Aeroporto Municipal de Maricá (SBMI), pela modernização de sua pista de pouso e decolagem e pela atração de empreendimentos industriais e tecnológicos no setor aeroespacial, o poder público municipal identificou uma oportunidade singular: transformar o investimento em infraestrutura aeroportuária em um vetor direto de transformação social. Em vez de limitar o desenvolvimento aeronáutico à atração de empresas externas que importam mão de obra especializada de outros centros, Maricá optou por formar os próprios moradores da cidade para ocuparem esses postos de trabalho de alta qualificação.</p><h3>A formação aeronáutica e o custo da profissionalização</h3><p>Para compreender o alcance social da política pública implementada em Maricá, é indispensável examinar a estrutura técnica e financeira da carreira de piloto civil no Brasil. A progressão profissional do piloto não ocorre de maneira linear simples, mas por meio de etapas cumulativas de habilitação teórica, médica e prática, regulamentadas pelo Regulamento Brasileiro da Aviação Civil (RBAC nº 61).</p><div class="ilist"><div class="it"><div><strong>Piloto Privado (PP)</strong>Porta de entrada na aviação. Exige o Certificado Médico Aeronáutico (CMA) de 2ª classe, aprovação no exame teórico da ANAC e um mínimo regulamentar de 35 a 40 horas de voo prático, a depender do programa do CIAC. O titular da licença está legalmente impedido de exercer atividade remunerada.</div></div><div class="it"><div><strong>Piloto Comercial (PC)</strong>Marco divisor entre o custo puro e a capacidade de geração de renda. Exige CMA de 1ª classe, aprovação em banca teórica avançada da ANAC e o mínimo de 150 horas totais de voo (ou 200 horas, conforme a modalidade de instrução). Somente a partir do PC o profissional pode voar de forma remunerada.</div></div><div class="it"><div><strong>Piloto de Linha Aérea (PLA)</strong>Ápice da certificação de pilotagem civil, exigido para a função de comandante em transporte aéreo público regular. Requer aproximadamente 1.500 horas de voo (ou a partir de 1.000 horas em contextos específicos), além de exames teóricos de elevada complexidade.</div></div></div><h3>O gargalo financeiro e as habilitações complementares</h3><p style="text-align-last: left;">O principal entrave à democratização da aviação reside no custo unitário da hora de voo. Tomando-se como referência conservadora de mercado o valor médio de R$ 1.000,00 por hora voada (valor frequentemente superado em aeronaves multimotoras ou helicópteros), o atingimento da marca mínima de 150 horas de voo exigidas para o Piloto Comercial representa um desembolso direto de aproximadamente R$ 150.000,00 apenas em instrução aérea, sem contabilizar cursos teóricos, taxas da ANAC, exames médicos, material</p></div></div><div class="ft"><span>Revista BID · Aviação e Sociedade</span><span class="pn">28</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Aviação e Sociedade</span></div><div class="bd"><div class="flow" style="height: 994.031px; flex: 0 0 auto;"><p>didático, deslocamentos e manutenção pessoal durante o período de estudos.</p><p>Além disso, no mercado de trabalho contemporâneo, a obtenção isolada do Piloto Comercial sob Regras de Voo Visual (VFR) em aeronaves monomotoras mostra-se insuficiente para a efetiva empregabilidade. As empresas de táxi aéreo, aviação executiva, transporte <i>offshore</i> e linhas aéreas exigem duas habilitações complementares: a <b>Habilitação de Voo por Instrumentos (IFR)</b>, que capacita o piloto a operar em condições meteorológicas adversas e em espaços aéreos controlados de alta densidade, e a <b>Habilitação Multimotor (MLTE)</b>, que o qualifica para operar aeronaves com mais de um motor, padrão dominante na aviação corporativa, regional, <i>offshore</i> e comercial.</p><table class="tb"><tbody><tr><th>Etapa / habilitação</th><th>Horas mínimas</th><th>Investimento estimado (R$ 1.000/h)</th><th>Status profissional</th></tr><tr><td><b>Piloto Privado</b></td><td>35 a 40 h</td><td>R$ 35 a 40 mil</td><td>Sem atividade remunerada (etapa intermediária)</td></tr><tr><td><b>Piloto Comercial</b></td><td>150 h totais</td><td>~ R$ 150 mil (acumulado)</td><td>Remunerado, mas restrito sem IFR/Multi</td></tr><tr><td><b>PC + IFR + Multimotor</b></td><td>150+ h (com simulador e multi)</td><td>R$ 170 a 210 mil+</td><td><b>Plena empregabilidade inicial</b> (táxi aéreo, instrutoria, copiloto)</td></tr><tr><td><b>Piloto de Linha Aérea</b></td><td>~ 1.000 a 1.500 h</td><td>Construído no exercício profissional</td><td>Comando de grandes aeronaves comerciais e <i>offshore</i></td></tr></tbody></table><p>Conforme evidencia o quadro, um jovem oriundo de família trabalhadora dificilmente consegue ultrapassar sequer a barreira inicial do Piloto Privado. Pior ainda: caso mobilize recursos extraordinários apenas para obter o PP, vê-se diante de uma licença que não lhe permite trabalhar nem recuperar o investimento realizado.</p><h3>Voar é Para Todos: motor de mobilidade social</h3><p>A visão estratégica formulada pela Prefeitura de Maricá e pela CODEMAR partiu de uma premissa clara de política pública: não basta subsidiar uma etapa intermediária que não garanta autonomia financeira; é necessário entregar o ciclo completo de empregabilidade.</p><p>Ao estruturar o programa <b>Voar é Para Todos</b>, articulado ao programa municipal <b>Passaporte Universitário</b> e executado em parceria com a Secretaria Municipal de Educação, o município rejeitou a ideia de oferecer apenas o curso de Piloto Privado. A diretriz contemplou a formação integral até o nível de Piloto Comercial com habilitações IFR e Multimotor, além da formação de Mecânicos de Manutenção Aeronáutica, com habilitações em Célula, Grupo Motopropulsor e Aviônicos.</p><h3>Da Situação A para a Situação B</h3><p>Um dos diferenciais mais relevantes da formação aeronáutica sob a ótica das políticas sociais é a compressão temporal do retorno sobre o investimento humano. Enquanto uma graduação universitária tradicional exige de quatro a cinco anos de dedicação antes que o estudante ingresse plenamente no mercado de trabalho qualificado, a formação completa de um Piloto Comercial com IFR e Multimotor, ou de um Mecânico de Manutenção Aeronáutica, ocorre em 12 a 24 meses. Nesse curto horizonte, ocorre uma ruptura positiva no ciclo intergeracional de renda:</p><div class="ilist"><div class="it"><div><strong>Situação A: o ponto de partida</strong>Um jovem morador de Maricá, egresso da rede pública de ensino, sem capital familiar acumulado e frequentemente inserido em ocupações informais ou de baixa remuneração, sem perspectiva de acesso a setores tecnológicos de ponta.</div></div><div class="it"><div><strong>Intervenção pública estruturada</strong>Custeio integral da formação teórica, dos exames médicos, das taxas regulatórias e das horas de voo e de oficina em CIACs credenciados e fiscalizados pela ANAC, com acompanhamento pedagógico e vínculo direto com o ecossistema aeroportuário local.</div></div><div class="it"><div><strong>Situação B: o ponto de chegada, em 1 a 2 anos</strong>Um profissional com licenças e habilitações reconhecidas internacionalmente sob os padrões da OACI, apto a ingressar no mercado com remuneração inicial de R$ 5.000 a R$ 8.000 em instrutoria, aviação geral ou manutenção, e com horizonte de progressão que pode superar R$ 30.000 a R$ 50.000 mensais na aviação comercial ou <i>offshore</i>.</div></div></div><h3>Sinergia com o ecossistema aeroportuário e industrial</h3><p>O desenho institucional de Maricá evita o erro recorrente de programas de qualificação desconectados da demanda real do território. A formação de pilotos e mecânicos está diretamente ancorada nos investimentos estruturantes conduzidos pela CODEMAR no Aeroporto Municipal de Maricá (SBMI) e no entorno tecnológico da cidade.</p><p><b>Operações offshore e logística aérea.</b> Maricá consolida-se como base estratégica de apoio às operações de petróleo e gás na Bacia de Santos, demandando fluxo contínuo de aeronaves de asas rotativas, serviços de rampa, abastecimento, despacho operacional e manutenção.</p><p style="text-align-last: left;"><b>Modernização e expansão aeroportuária.</b> As obras de modernização da pista de pouso e decolagem, a ampliação de pátios e os projetos de expansão futura ampliam a capacidade do aeródromo para</p></div></div><div class="ft"><span>Revista BID · Aviação e Sociedade</span><span class="pn">29</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Aviação e Sociedade</span></div><div class="bd"><div class="flow last" style="height: auto; flex: 0 0 auto;"><p>receber aeronaves executivas de maior porte e operações comerciais regionais.</p><p><b>Indústria aeronáutica e inovação.</b> Parcerias tecnológicas e industriais, como os acordos voltados ao desenvolvimento de aeronaves e à cooperação com instituições aeroespaciais, criam um ambiente em que o técnico formado em Maricá encontra oportunidades tanto na operação aérea quanto na cadeia produtiva e de manutenção.</p><h3>Impactos, governança e replicabilidade</h3><p>A iniciativa maricaense transcende o assistencialismo tradicional ao operar sob a lógica de investimento público produtivo, com retorno fiscal e social mensurável. Cada cidadão formado e inserido na aviação civil deixa de demandar redes de proteção social e passa a gerar massa salarial qualificada, consumo local e arrecadação tributária, além de elevar o capital humano do município. Do ponto de vista da governança, o modelo destaca-se por três pilares.</p><p><b>Rigor regulatório e qualidade técnica.</b> O credenciamento rigoroso de CIACs homologados pela ANAC assegura que o ensino gratuito oferecido aos jovens maricaenses tenha o mesmo padrão técnico, operacional e de segurança exigido pelas grandes companhias aéreas nacionais e internacionais.</p><p><b>Equidade de gênero e diversidade.</b> Em um setor no qual mulheres e pessoas negras ou de baixa renda representam percentuais historicamente reduzidos nas cabines de comando e nos hangares de manutenção, a seleção por edital público com critérios sociais democratiza o perfil demográfico da aviação brasileira, alinhando-se às diretrizes nacionais e internacionais de diversidade no transporte aéreo.</p><p><b>Efeito multiplicador comunitário.</b> A presença de jovens filhos de trabalhadores locais vestindo o uniforme de piloto comercial ou atuando como mecânicos certificados no aeroporto de sua própria cidade exerce poderoso efeito demonstrativo nas escolas públicas do município, estimulando o interesse por ciências exatas, física, matemática e língua inglesa.</p><h3>Conclusão</h3><p>A experiência de Maricá demonstra que as barreiras historicamente consideradas intransponíveis na aviação civil não são de natureza técnica, mas essencialmente financeira e institucional. Ao compreender que o investimento médio de R$ 150 mil a R$ 200 mil necessário para alcançar o patamar de Piloto Comercial com IFR e Multimotor constituía um muro invisível para a juventude trabalhadora, o município interveio de forma cirúrgica e estruturante.</p><p>Por meio da integração entre infraestrutura aeroportuária (CODEMAR), política educacional (Passaporte Universitário e Secretaria de Educação) e certificação regulatória (ANAC), Maricá transformou um ciclo formativo rápido, de apenas um a dois anos, em uma ponte sólida entre a exclusão socioeconômica e uma das carreiras mais qualificadas e globalizadas do mundo. Mais do que formar pilotos e mecânicos, o projeto consolida um paradigma replicável de desenvolvimento regional, provando que a alta tecnologia e a inclusão social não apenas são compatíveis, mas se potencializam mutuamente quando orientadas por visão estratégica de Estado.<span class="end"></span></p><div class="refs"><b>Referências</b><div>AGÊNCIA NACIONAL DE AVIAÇÃO CIVIL (ANAC). Regulamento Brasileiro da Aviação Civil, RBAC nº 61: Licenças, Habilitações e Certificados para Pilotos. Brasília: ANAC, 2024.</div><div>ANAC. Programa Asas para Todos: Diversidade, Inclusão e Capacitação no Setor Aéreo Brasileiro. Brasília: Ministério de Portos e Aeroportos/ANAC, 2024.</div><div>COMPANHIA DE DESENVOLVIMENTO DE MARICÁ (CODEMAR). Projeto Voar é Para Todos: Credenciamento de CIACs e Expansão do Aeroporto Municipal de Maricá (SBMI). Maricá: CODEMAR, 2025–2026.</div><div>PREFEITURA MUNICIPAL DE MARICÁ. Programa Passaporte Universitário e Políticas Municipais de Qualificação Profissional e Desenvolvimento Econômico. Maricá: Secretaria Municipal de Educação, 2026.</div></div></div><div class="fill bgimg" style="background-image:url('img/aluna.jpg')"></div></div><div class="ft"><span>Revista BID · Aviação e Sociedade</span><span class="pn">30</span></div></section><section class="page" data-art="dionisio"><div class="hero bgimg" style="height:150mm;background-image:url('img/porto.jpg');background-position:center 50%"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Direito Marítimo</span></div>
   <div class="kick">Direito Marítimo · Tribunal Marítimo</div><div class="ttl ">Registro de embarcações e armadores no Tribunal Marítimo</div><div class="deck">Nacionalidade, validade, segurança jurídica e publicidade: como o sistema registral marítimo sustenta a navegação, a indústria naval e o financiamento do setor.</div></div>
   <div class="byl"><div class="ph" style=""></div><div><div class="nm">Dionísio Tavares da Câmara Junior</div><div class="cr">Capitão de Mar e Guerra (RM1) · Diretor de Registros do Tribunal Marítimo</div></div></div>
   <div class="bd" style="padding-top:4mm"><div class="flow" style="height: 419.562px; flex: 0 0 auto;"><p class="drop">O registro da propriedade de embarcações constitui instrumento essencial para a organização do transporte aquaviário e para a consolidação da segurança jurídica das atividades relacionadas à navegação. Trata-se de um mecanismo jurídico-administrativo destinado não apenas a formalizar a existência da embarcação como bem móvel de relevante valor econômico, mas também a identificar seu proprietário e a dar publicidade a eventuais ônus, gravames ou limitações que sobre ela incidam.</p><p>No ordenamento jurídico brasileiro, o registro da propriedade marítima insere-se em um sistema registral mais amplo, desempenhando função análoga àquela atribuída a outros regimes de registro de bens. Assim como os imóveis são registrados nos Cartórios de Registro Geral de Imóveis, nos termos da Lei nº 6.015/1973, e as aeronaves são inscritas no Registro Aeronáutico Brasileiro, consoante o disposto na Lei nº 7.565/1986, sob a administração da Agência Nacional de Aviação Civil (ANAC), as embarcações submetem-se ao regime jurídico estabelecido pela Lei nº 7.652/1988, sendo essa atribuição exercida pelo Tribunal Marítimo.</p><p>A relevância desse sistema transcende a mera identificação e controle das embarcações. Ele constitui verdadeiro pilar das relações jurídicas e econômicas no setor marítimo, ao assegurar a proteção dos direitos de proprietários, armadores, financiadores e demais agentes envolvidos na atividade. Por meio do registro, consolidam-se informações essenciais relativas às características técnicas da embarcação, à titularidade dominial, à existência de garantias reais e a todas as modificações relevantes ocorridas ao longo de sua vida operacional. Os objetivos centrais do registro da propriedade marítima podem ser sintetizados em quatro: nacionalidade, validade, segurança jurídica e publicidade.</p></div></div><div class="ft"><span>Revista BID · Direito Marítimo</span><span class="pn">31</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Direito Marítimo</span></div><div class="bd"><div class="band bgimg" style="height:82mm;background-image:url('img/registro.jpg')"></div><div class="flow" style="height: 667.125px; flex: 0 0 auto;"><div class="ilist"><div class="it"><div><strong>Nacionalidade</strong>Refere-se à bandeira sob a qual a embarcação está registrada e, consequentemente, ao Estado cuja legislação rege sua operação. Define o regime jurídico aplicável, influenciando a jurisdição em casos de acidentes, a aplicação de normas de segurança, a incidência de tributos e taxas portuárias e as condições de acesso a portos estrangeiros.</div></div><div class="it"><div><strong>Validade</strong>Relaciona-se à autenticidade e à legalidade do ato registral, garantindo que a propriedade da embarcação esteja devidamente formalizada perante o Estado, o que assegura a regularidade da navegação, possibilita a fiscalização e previne o uso de embarcações em atividades ilícitas.</div></div><div class="it"><div><strong>Segurança jurídica</strong>É a garantia institucional de que os direitos de propriedade e os interesses dos agentes econômicos serão protegidos. O proprietário pode utilizar, alienar ou oferecer a embarcação como garantia em operações financeiras, com estabilidade e previsibilidade.</div></div><div class="it"><div><strong>Publicidade</strong>Garante a transparência do sistema registral, ao permitir o acesso às informações sobre a propriedade e os ônus incidentes sobre a embarcação, reduzindo riscos, prevenindo fraudes e promovendo segurança nas transações.</div></div></div><p>Nesse contexto, o registro marítimo desempenha papel fundamental na estrutura institucional do setor naval, contribuindo para o desenvolvimento da navegação, para o fortalecimento da indústria marítima e para a estabilidade das relações comerciais que dependam do transporte aquaviário.</p><h3>História do registro de embarcações</h3><p>A prática de registrar embarcações possui origens remotas, intrinsecamente vinculadas ao desenvolvimento do comércio marítimo e à necessidade de controle das atividades de navegação. Desde a Antiguidade, diferentes civilizações já reconheciam a importância de manter registros capazes de identificar embarcações, seus proprietários e as cargas transportadas, constituindo uma base primária de organização das relações comerciais no ambiente marítimo.</p><p>Nos períodos mais longínquos, tais registros tinham finalidade predominantemente fiscal e aduaneira, permitindo aos Estados controlar o comércio marítimo e arrecadar tributos sobre as mercadorias transportadas. Com o avanço das atividades comerciais durante a Idade Média, o controle das embarcações passou também a desempenhar papel importante na segurança da navegação e na proteção das rotas comerciais.</p><p>Um marco importante na evolução dos sistemas de registro marítimo ocorreu em 1760, com a criação do Lloyd’s Register of Shipping, considerado o primeiro sistema moderno de classificação e registro de navios. Sua origem remonta ao Lloyd’s Coffee House, em Londres, ponto de encontro de armadores, comerciantes e construtores navais, onde eram compartilhadas informações sobre as condições das embarcações, suas características estruturais e seus proprietários. Essa prática, inicialmente informal, evoluiu progressivamente para um sistema estruturado de registro e certificação, tornando-se referência internacional e influenciando modelos adotados por diversos países.</p><p style="text-align-last: justify;">Outro marco relevante foi a Convenção Internacional de Bruxelas de 1924, que tratou da limitação da responsabilidade civil dos proprietários de navios de alto-mar. A</p></div></div><div class="ft"><span>Revista BID · Direito Marítimo</span><span class="pn">32</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Direito Marítimo</span></div><div class="bd"><div class="flow" style="height: 994.031px; flex: 0 0 auto;"><p>convenção estabeleceu parâmetros internacionais para responsabilização em casos de acidentes marítimos e reforçou a importância da identificação e do registro das embarcações como instrumentos de segurança jurídica e padronização das atividades marítimas.</p><p>No Brasil, a evolução do registro marítimo remonta ao período colonial. Desde o início da colonização portuguesa, em 1500, já existiam formas rudimentares de controle das embarcações que navegavam nas águas do território brasileiro, especialmente relacionadas à exploração econômica e ao comércio de recursos naturais.</p><p>Um avanço significativo ocorreu em 1808, com a transferência da Corte Portuguesa para o Brasil e a consequente abertura dos portos às nações amigas. Nesse contexto, foi instituído, no Rio de Janeiro, um sistema formal de registro público de navios, conduzido pela Intendência Geral da Marinha, permitindo maior controle sobre o fluxo de embarcações e representando um marco institucional na administração das atividades marítimas no país.</p><p>Durante o período imperial, novos instrumentos legais foram criados para regulamentar o registro de embarcações. Destacam-se os Decretos nº 864/1851 e nº 930/1852, que atribuíram às Juntas Comerciais a competência para registrar embarcações brasileiras destinadas à navegação de alto-mar. Posteriormente, o Decreto nº 1.597/1855 instituiu as Conservatórias de Registros Marítimos, consolidando uma estrutura administrativa voltada ao controle sistemático da propriedade naval.</p><p>Com a Proclamação da República, o sistema registral marítimo passou por um processo contínuo de aperfeiçoamento institucional. Em 1931, o Decreto nº 20.829 criou a Diretoria da Marinha Mercante, contribuindo para a reorganização administrativa do setor. Em 1934, foi instituído o Tribunal Marítimo (TM), por meio do Decreto nº 24.585, atribuindo-lhe competências relacionadas tanto ao julgamento de acidentes e fatos da navegação quanto à manutenção do registro da propriedade marítima.</p><p>O primeiro registro de propriedade realizado pelo TM ocorreu em 26 de fevereiro de 1935, referente à embarcação Maceió, construída na Inglaterra em 1888 e pertencente à Companhia Carbonífera Riograndense. Esse evento simboliza o início da sistematização formal do controle da propriedade marítima no Brasil.</p><div class="tl"><div><b>1760</b>Criação do Lloyd’s Register of Shipping, em Londres</div><div><b>1808</b>Registro público de navios pela Intendência Geral da Marinha, no Rio de Janeiro</div><div><b>1855</b>Decreto nº 1.597 cria as Conservatórias de Registros Marítimos</div><div><b>1934</b>Decreto nº 24.585 institui o Tribunal Marítimo</div><div><b>1935</b>Primeiro registro de propriedade no TM: a embarcação Maceió</div><div><b>1939</b>Primeiro registro de ônus: hipoteca do iate Vigilante II</div><div><b>1997</b>Lei nº 9.432 cria o Registro Especial Brasileiro (REB)</div><div><b>2022</b>Lei nº 14.301 institui o programa BR do Mar</div></div><p>Nas décadas seguintes, o arcabouço jurídico do setor foi significativamente consolidado. Destacam-se a Lei nº 2.180/1954, que estruturou o funcionamento do Tribunal Marítimo; a Lei nº 7.652/1988, que instituiu o regime atual do registro da propriedade marítima; e a Lei nº 9.432/1997, responsável pela criação do Registro Especial Brasileiro (REB), voltado ao fomento da marinha mercante nacional. Mais recentemente, a Lei nº 14.301/2022 instituiu o programa BR do Mar, voltado à modernização da cabotagem e ao fortalecimento da marinha mercante nacional.</p><h3>Registro de embarcações, armadores e ônus no Tribunal Marítimo</h3><p>O TM exerce papel central na estrutura institucional do direito marítimo brasileiro. Nos termos da Lei nº 2.180/1954, compete a essa Corte administrativa não apenas o julgamento dos acidentes e fatos da navegação, mas também a manutenção do registro geral da propriedade naval, dos armadores e dos ônus incidentes sobre embarcações brasileiras. Tal atribuição confere características que o aproximam de um sistema registral de natureza cartorial especializada, cuja finalidade primordial é assegurar a segurança jurídica das relações econômicas que se desenvolvem no âmbito da navegação.</p><p style="text-align-last: left;">O registro da propriedade possui caráter obrigatório para as embarcações brasileiras com arqueação bruta superior a cem toneladas, conforme disposto na Lei nº 7.652/1988. A arqueação bruta, entendida como o volume total dos espaços internos da embarcação, constitui parâmetro internacionalmente adotado para a classificação do porte dos navios, influenciando, entre outros aspectos, a</p></div></div><div class="ft"><span>Revista BID · Direito Marítimo</span><span class="pn">33</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Direito Marítimo</span></div><div class="bd"><div class="flow" style="height: 994.031px; flex: 0 0 auto;"><p>incidência de taxas portuárias e o cumprimento de requisitos regulatórios.</p><p>Nesse contexto, existem três registros principais de natureza obrigatória: o registro da propriedade marítima, que formaliza a titularidade da embarcação; o registro de armador, que habilita o agente responsável por sua exploração econômica; e o registro de ônus, que assegura a publicidade dos gravames e garantias incidentes sobre o bem. Além desses instrumentos, existem os registros de natureza facultativa voltados ao fomento da marinha mercante nacional, destacando-se o Registro Especial Brasileiro (REB) e o Pré-Registro no REB (PRÉ-REB), que desempenham papel relevante na promoção do desenvolvimento do setor naval e no incentivo à atividade de navegação no país.</p><h3>Registro da Propriedade Marítima</h3><p>O registro da propriedade marítima constitui o instrumento jurídico por meio do qual se formaliza, perante o Estado brasileiro, a titularidade de uma embarcação. Sua função primordial é assegurar publicidade e segurança jurídica às relações envolvendo navios, permitindo que terceiros tenham pleno conhecimento da situação jurídica do bem e, assim, possam realizar transações com maior previsibilidade e confiança.</p><p>O procedimento registral tem início, em regra, após a entrega da embarcação ao seu proprietário, momento em que se formaliza o termo de entrega e aceitação celebrado entre o estaleiro construtor e o adquirente, consolidando juridicamente a transferência da titularidade do bem. A partir dessa etapa, impõe-se ao proprietário a adoção das providências necessárias à regularização administrativa e jurídica da embarcação, iniciando-se pela sua inscrição junto às Capitanias dos Portos, Delegacias ou Agências da Marinha, órgãos responsáveis pelo controle administrativo, pela fiscalização e pelo acompanhamento das embarcações em suas respectivas áreas de jurisdição.</p><p>Todavia, quando se trata de embarcações com arqueação bruta superior a cem toneladas, a legislação vigente estabelece, de forma adicional, a obrigatoriedade de seu registro no Tribunal Marítimo. Nesses casos, para além da inscrição, incumbe ao proprietário requerer o registro da embarcação perante aquela Corte, com o objetivo de formalizar a titularidade sob a perspectiva jurídica, conferindo-lhe publicidade, autenticidade e eficácia perante terceiros.</p><p>No que se refere à comprovação da propriedade, o ordenamento jurídico estabelece distinção conforme o porte da embarcação. Para aquelas com arqueação bruta inferior a cem toneladas, o Título de Inscrição de Embarcação (TIE), emitido pelas Capitanias dos Portos, constitui o instrumento hábil à comprovação da titularidade. Para embarcações de maior porte, o Tribunal Marítimo expede a Provisão de Registro da Propriedade Marítima (PRPM), que se consolida como o principal documento jurídico comprobatório da titularidade, reunindo as informações essenciais sobre o bem e servindo como referência para os atos registrais subsequentes. Esse documento concentra os dados identificadores da embarcação, suas características técnicas, a qualificação do proprietário, o eventual registro de armador e a existência de ônus ou gravames.</p><h3>Registro de Armador</h3><p>O armador é a pessoa física ou jurídica responsável pela exploração econômica da embarcação, assumindo a condução de sua operação e a gestão de todas as atividades a ela relacionadas. Embora, em muitos casos, essa figura coincida com a do proprietário, tal correspondência não é necessária, uma vez que a utilização comercial da embarcação pode ser atribuída a terceiros por meio de instrumentos contratuais, como o afretamento ou outras formas de cessão de uso.</p><p>A atividade de armação abrange um conjunto amplo e complexo de responsabilidades, que envolvem desde o aprestamento e a manutenção da embarcação até a organização e gestão da tripulação, o cumprimento rigoroso das normas de segurança da navegação e a contratação de seguros. Ademais, compete ao armador a condução das atividades comerciais vinculadas à embarcação, incluindo a negociação de contratos de transporte, afretamento e demais operações inerentes à exploração econômica do navio.</p><p>No ordenamento jurídico brasileiro, o registro de armador possui natureza obrigatória sempre que uma pessoa física ou jurídica pretenda operar embarcação mercante com arqueação bruta superior a cem toneladas ou, ainda, quando o somatório das arqueações das embarcações sob sua responsabilidade ultrapassar esse limite. Concluído o processo registral, o Tribunal Marítimo expede o Certificado de Registro de Armador (CRA), documento que formaliza a habilitação do interessado para o exercício da atividade de armação, com validade de até cinco anos.</p><h3>Registro de ônus sobre embarcações</h3><p style="text-align-last: left;">O registro de ônus sobre embarcações tem por finalidade conferir publicidade às garantias constituídas sobre esses bens, assegurando proteção jurídica aos credores e promovendo transparência nas relações comerciais que envolvem a atividade marítima. Nos termos da legislação brasileira, os direitos reais e os gravames incidentes sobre embarcações somente produzem efeitos</p></div></div><div class="ft"><span>Revista BID · Direito Marítimo</span><span class="pn">34</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Direito Marítimo</span></div><div class="bd"><div class="flow" style="height: 994.031px; flex: 0 0 auto;"><p>em relação a terceiros após o seu registro no TM.</p><p>Dentre as principais modalidades de ônus registráveis, destaca-se a hipoteca naval, garantia real na qual a embarcação permanece na posse do devedor, mas fica vinculada ao cumprimento de uma obrigação financeira, conferindo ao credor, em caso de inadimplemento, direito de preferência sobre o produto da eventual alienação do bem. Outra modalidade relevante é a alienação fiduciária, pela qual a propriedade da embarcação é transferida ao credor fiduciário até a quitação integral da dívida, mantendo-se a posse direta com o devedor durante a vigência do contrato. Há, ainda, a reserva de domínio, comumente utilizada em contratos de compra e venda, por meio da qual o vendedor retém a propriedade do bem até o pagamento integral do preço ajustado.</p><p>A importância histórica desse sistema registral evidencia-se pelo fato de que o primeiro registro de ônus realizado no Tribunal Marítimo ocorreu em 1939, envolvendo a hipoteca do iate “Vigilante II”, marco que demonstra a consolidação, já naquele período, de instrumentos jurídicos voltados à proteção de garantias financeiras no âmbito da navegação.</p><h3>Registro Especial Brasileiro (REB) e PRÉ-REB</h3><p>O Registro Especial Brasileiro (REB), instituído pela Lei nº 9.432/1997 e regulamentado pelo Decreto nº 2.256/1997, configura-se como um dos mais relevantes instrumentos de política pública voltados ao fortalecimento da marinha mercante nacional. Trata-se de um regime jurídico especial de registro concebido para ampliar a competitividade do transporte aquaviário brasileiro, por meio da concessão de incentivos fiscais e operacionais às embarcações nele inscritas.</p><p>A criação do REB decorreu da necessidade de mitigar as assimetrias competitivas existentes no setor marítimo global, especialmente diante da atratividade de registros estrangeiros caracterizados por regimes tributários mais vantajosos e maior flexibilidade regulatória. Nesse contexto, o regime brasileiro foi estruturado como mecanismo de equalização concorrencial, permitindo que embarcações sob bandeira nacional operem com maior eficiência econômica e capacidade de inserção nos fluxos internacionais de comércio.</p><p>Dentre os principais benefícios associados ao REB, destacam-se a redução ou isenção de tributos incidentes sobre a importação de embarcações, equipamentos e insumos, tais como o Imposto de Importação (II), o Imposto sobre Produtos Industrializados (IPI), as contribuições ao PIS/PASEP e à COFINS e o Imposto sobre Circulação de Mercadorias e Serviços (ICMS), conforme a legislação aplicável. Esses incentivos reduzem os custos de aquisição, modernização e manutenção das embarcações, contribuindo diretamente para a renovação e ampliação da frota nacional.</p><p>Para além do aspecto tributário, o REB também introduz maior flexibilidade operacional ao permitir, em hipóteses específicas, a utilização de embarcações estrangeiras sob regime de afretamento a casco nu, com suspensão provisória de bandeira e subsequente operação sob bandeira brasileira. Tal mecanismo amplia a capacidade operacional das empresas brasileiras de navegação, favorecendo o incremento da oferta de transporte e a otimização da logística nacional.</p><p>Outro aspecto de grande relevância reside no impacto do REB sobre a indústria naval brasileira, uma vez que o regime incentiva a construção, a manutenção e a modernização de embarcações em estaleiros nacionais, contribuindo para a geração de empregos, o desenvolvimento tecnológico e o fortalecimento da cadeia produtiva do setor. O REB possui natureza facultativa, podendo ser requerido pelas Empresas Brasileiras de Navegação (EBN) que atendam aos requisitos legais e regulatórios aplicáveis, especialmente quanto à regularidade fiscal, à autorização para operar no setor e à conformidade com as normas da autoridade marítima. Sua adesão configura, portanto, decisão estratégica empresarial, orientada pela busca de maior eficiência e competitividade.</p><p>Em estreita articulação com o REB, o Pré-Registro Especial Brasileiro (PRÉ-REB) foi concebido como instrumento complementar de estímulo à indústria naval nacional, voltado especificamente à fase de construção das embarcações. Esse mecanismo permite o registro antecipado de navios ainda em construção, viabilizando, desde os estágios iniciais do empreendimento, o acesso a incentivos fiscais e a condições mais favoráveis de financiamento.</p><p>Ao possibilitar o enquadramento prévio da embarcação no regime especial, o PRÉ-REB contribui para a redução dos custos de construção, promove maior previsibilidade econômica aos investimentos e incentiva a contratação de estaleiros localizados em território nacional, gerando efeitos positivos sobre a cadeia produtiva e a geração de empregos. Consolida-se, assim, como instrumento de política pública de elevada relevância, ao alinhar incentivos econômicos a objetivos estruturantes de fortalecimento da indústria naval e de ampliação da frota brasileira.</p><h3>Considerações finais</h3><p style="text-align-last: left;">O sistema de registro marítimo brasileiro configura-se como um dos principais pilares institucionais da segurança jurídica no setor naval, desempenhando papel</p></div></div><div class="ft"><span>Revista BID · Direito Marítimo</span><span class="pn">35</span></div></section><section class="page"><div class="hd"><span class="brand">REVISTA <b>BID</b></span><span class="ed">Direito Marítimo</span></div><div class="bd"><div class="flow last" style="height: auto; flex: 0 0 auto;"><p>fundamental na organização e no funcionamento das atividades de navegação. Por meio desse sistema, assegura-se não apenas a adequada identificação das embarcações, mas também a proteção dos direitos de propriedade, a transparência das transações e a formalização de garantias financeiras, elementos indispensáveis à estabilidade das relações jurídicas e econômicas no ambiente marítimo.</p><p>Nesse contexto, o Tribunal Marítimo exerce função de elevada relevância, atuando de forma integrada tanto na esfera jurisdicional administrativa, ao julgar acidentes e fatos da navegação, quanto na esfera registral, ao manter e atualizar os registros da propriedade marítima, dos armadores e dos ônus incidentes sobre embarcações. Tal atuação confere unidade e coerência ao sistema, reforçando sua credibilidade e eficácia.</p><p>Adicionalmente, instrumentos como o REB e o PRÉ-REB evidenciam a dimensão estratégica do sistema registral, que transcende sua função meramente formal para assumir papel ativo na implementação de políticas públicas voltadas ao fortalecimento da marinha mercante e ao desenvolvimento da indústria naval nacional.</p><p>Diante da crescente relevância do transporte marítimo no comércio internacional e da necessidade de aprimoramento da matriz logística brasileira, o contínuo aperfeiçoamento das instituições e dos instrumentos de registro marítimo revela-se indispensável. O fortalecimento desse arcabouço institucional constitui elemento estratégico para a promoção da eficiência econômica, da segurança jurídica e da inserção competitiva do Brasil no cenário global.<span class="end"></span></p><div class="refs"><b>Referências</b><div>BRASIL. Lei nº 2.180, de 5 de fevereiro de 1954. Dispõe sobre o Tribunal Marítimo.</div><div>BRASIL. Lei nº 7.652, de 3 de fevereiro de 1988. Dispõe sobre o Registro da Propriedade Marítima.</div><div>BRASIL. Lei nº 9.432, de 8 de janeiro de 1997. Dispõe sobre a ordenação do transporte aquaviário.</div><div>BRASIL. Lei nº 9.774, de 21 de dezembro de 1998. Altera a Lei nº 7.652/1988.</div><div>BRASIL. Lei nº 14.301, de 7 de janeiro de 2022. Institui o Programa de Estímulo ao Transporte por Cabotagem (BR do Mar).</div><div>BRASIL. Decreto nº 20.829, de 21 de dezembro de 1931. Cria a Diretoria da Marinha Mercante.</div><div>BRASIL. Decreto nº 2.256, de 17 de junho de 1997. Regulamenta o Registro Especial Brasileiro (REB).</div><div>MARINHA DO BRASIL, Diretoria de Portos e Costas. NORMAM-201 e NORMAM-202. Rio de Janeiro, 2025.</div><div>TRIBUNAL MARÍTIMO. Portaria TM/MB nº 16, de 1º de outubro de 2024.</div><div>ANTAQ. Resolução Normativa nº 5, de 23 de fevereiro de 2016.</div></div><div class="bio"><b>Sobre o autor</b>Dionísio Tavares da Câmara Junior é Diretor de Registros do Tribunal Marítimo e Capitão de Mar e Guerra (RM1) do Corpo da Armada. Graduado em Ciências Navais pela Escola Naval, tem MBA em Gestão Empresarial pela COPPEAD/UFRJ, mestrado em Ciências Navais pela Escola de Guerra Naval e mestrado em Segurança e Defesa Hemisférica pelo Colégio Interamericano de Defesa, em Washington (EUA).</div></div><div class="fill bgimg" style="background-image:url('img/navio.jpg')"></div></div><div class="ft"><span>Revista BID · Direito Marítimo</span><span class="pn">36</span></div></section><section class="page"><img src="a/contracapa.jpg" style="width:100%;height:100%;object-fit:cover"></section></template>
<script src="page-flip.browser.js"></script>
<script>
const SRC=document.getElementById('src').content; const N=SRC.querySelectorAll('.page').length;
const PW=793.7, PH=1122.5; let pf=null, mode='auto'; try{mode=localStorage.getItem('bid2Mode')||'auto'}catch(e){}
function fit(){const m=document.querySelector('main').getBoundingClientRect(); const two=mode==='duas'||(mode==='auto'&&m.width>=760);
 let h=m.height-28,w=h*PW/PH; const maxW=two?(m.width-28)/2:m.width-28; if(w>maxW){w=maxW;h=w*PH/PW;} return {w:Math.floor(w),h:Math.floor(h)};}
function build(start){
 if(pf){try{pf.destroy()}catch(e){}}
 const main=document.querySelector('main'); main.innerHTML='<div id="book"></div>'; const book=document.getElementById('book'); const f=fit(); const k=f.w/PW;
 SRC.querySelectorAll('.page').forEach((p,i)=>{const d=document.createElement('div'); d.className='pg'; if(i===0||i===N-1) d.dataset.density='hard';
  const c=p.cloneNode(true); c.style.transform='scale('+k+')'; d.appendChild(c); book.appendChild(d);});
 pf=new St.PageFlip(book,{width:f.w,height:f.h,size:'fixed',showCover:true,usePortrait:mode!=='duas',maxShadowOpacity:.45,mobileScrollSupport:false,flippingTime:750});
 pf.loadFromHTML(book.querySelectorAll('.pg')); pf.on('flip',upd); pf.on('changeOrientation',upd); if(start) pf.turnToPage(start);
 document.getElementById('mode').textContent=mode==='duas'?'2 páginas ✓':'2 páginas'; upd();}
function upd(){const i=pf.getCurrentPageIndex(),o=pf.getOrientation(); let l=String(i+1); if(o==='landscape'&&i>0&&i<N-1) l=(i+1)+'–'+Math.min(i+2,N);
 document.getElementById('count').textContent=l+' / '+N; document.getElementById('prev').disabled=i===0; document.getElementById('first').disabled=i===0;
 document.getElementById('next').disabled=i>=N-1||(o==='landscape'&&i>=N-2&&i!==0);
 document.querySelectorAll('#thumbs .tb').forEach((t,j)=>t.classList.toggle('cur',j===i||(o==='landscape'&&j===i+1&&i>0)));
 try{history.replaceState(null,'','#p'+(i+1))}catch(e){}}
document.getElementById('prev').onclick=()=>pf.flipPrev(); document.getElementById('next').onclick=()=>pf.flipNext();
document.getElementById('first').onclick=()=>{pf.turnToPage(0);upd()}; document.getElementById('last').onclick=()=>{pf.turnToPage(N-1);upd()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')pf.flipNext(); if(e.key==='ArrowLeft')pf.flipPrev();});
const th=document.getElementById('thumbs');
SRC.querySelectorAll('.page').forEach((p,i)=>{const t=document.createElement('div'); t.className='tb'; const w=document.createElement('div'); w.className='tw'; w.appendChild(p.cloneNode(true)); t.appendChild(w); t.insertAdjacentHTML('beforeend',String(i+1).padStart(2,'0')); t.onclick=()=>{pf.turnToPage(i);upd();th.classList.remove('on')}; th.appendChild(t);});
document.getElementById('grid').onclick=()=>{th.classList.toggle('on'); const c=th.querySelector('.cur'); if(c) c.scrollIntoView({inline:'center',block:'nearest'});};
document.getElementById('mode').onclick=()=>{mode=mode==='duas'?'auto':'duas'; try{localStorage.setItem('bid2Mode',mode)}catch(e){} build(pf.getCurrentPageIndex());};
document.getElementById('fs').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){}};
let rt; addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(()=>build(pf.getCurrentPageIndex()),250)});
document.fonts.ready.then(()=>{const m=/^#p(\d+)$/.exec(location.hash); build(m?Math.min(N,Math.max(1,+m[1]))-1:0);});
</script></body></html>
