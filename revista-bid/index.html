<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revista BID · Base Industrial de Defesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1828;--deep:#060F1C;--gold:#C79A3F;--gold2:#E3C27A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:radial-gradient(ellipse at 50% 30%,#14263d 0%,#060F1C 70%);color:#fff;font-family:Montserrat,sans-serif;overflow:hidden}
header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(227,194,122,.25)}
.brand{font-weight:800;letter-spacing:.32em;font-size:12px}.brand b{color:var(--gold)}
.sub{font-weight:600;letter-spacing:.22em;font-size:10px;color:#8D97A6;text-transform:uppercase}
main{position:absolute;top:52px;bottom:64px;left:0;right:0;display:flex;align-items:center;justify-content:center;padding:14px}
#book{margin:0 auto}
.page{background:#fff}
.page img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
footer{position:absolute;bottom:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:center;gap:10px;border-top:1px solid rgba(227,194,122,.25);background:rgba(6,15,28,.6)}
button{font:700 12px Montserrat;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(227,194,122,.5);height:38px;min-width:38px;padding:0 14px;cursor:pointer;letter-spacing:.08em}
button:hover{background:rgba(227,194,122,.18)}button:disabled{opacity:.35;cursor:default}
#count{font-weight:800;font-size:13px;min-width:92px;text-align:center;color:var(--gold2)}
#thumbs{position:absolute;left:0;right:0;bottom:64px;height:150px;background:rgba(6,15,28,.96);border-top:1px solid rgba(227,194,122,.3);
 display:none;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding:12px 16px;align-items:center}
#thumbs.on{display:flex}
#thumbs div{flex:none;scroll-snap-align:center;cursor:pointer;text-align:center;font-size:10px;font-weight:700;color:#8D97A6;min-width:0}
#thumbs img{height:104px;display:block;border:2px solid transparent;margin-bottom:4px}
#thumbs div.cur img{border-color:var(--gold)}
.hint{position:absolute;top:60px;left:50%;transform:translateX(-50%);font-size:11px;color:#8D97A6;letter-spacing:.1em;transition:opacity .6s}
@media(max-width:600px){.sub{display:none}button.wide{display:none}footer{gap:6px}button{padding:0 10px}}
</style></head><body>
<header><div class="brand">REVISTA <b>BID</b></div><div class="sub">Base Industrial de Defesa · 2026</div></header>
<div class="hint" id="hint">Arraste o canto da página ou use as setas para folhear</div>
<main><div id="book"></div></main>
<div id="thumbs"></div>
<footer>
 <button id="first" class="wide" title="Capa">⏮</button>
 <button id="prev" title="Anterior">‹</button>
 <div id="count">1 / 23</div>
 <button id="next" title="Próxima">›</button>
 <button id="last" class="wide" title="Contracapa">⏭</button>
 <button id="mode">2 páginas</button>
 <button id="grid">Páginas</button>
 <button id="fs" class="wide">Tela cheia</button>
</footer>
<script src="page-flip.browser.js"></script>
<script>
const N=23; let pf=null; let mode='auto';
try{mode=localStorage.getItem('bidMode')||'auto';}catch(e){}
function fit(){const m=document.querySelector('main').getBoundingClientRect();
 const two = mode==='duas' || (mode==='auto' && m.width>=760); const ratio=297/210;
 let h=m.height-28, w=h/ratio; const maxW=two?(m.width-28)/2:m.width-28;
 if(w>maxW){w=maxW;h=w*ratio;} return {w:Math.floor(w),h:Math.floor(h),two};}
function build(start){
 if(pf){try{pf.destroy();}catch(e){}}
 const main=document.querySelector('main'); main.innerHTML='<div id="book"></div>';
 const book=document.getElementById('book');
 for(let i=1;i<=N;i++){const d=document.createElement('div');d.className='page';
  if(i===1||i===N) d.dataset.density='hard';
  d.innerHTML=`<img src="pages/p-${String(i).padStart(2,'0')}.jpg" alt="Página ${i}" loading="${i<5?'eager':'lazy'}">`;book.appendChild(d);}
 const f=fit();
 pf=new St.PageFlip(book,{width:f.w,height:f.h,size:'fixed',showCover:true,usePortrait:mode!=='duas',
  maxShadowOpacity:.45,mobileScrollSupport:false,flippingTime:750,drawShadow:true});
 pf.loadFromHTML(book.querySelectorAll('.page'));
 pf.on('flip',upd); pf.on('changeOrientation',upd);
 if(start) pf.turnToPage(start);
 document.getElementById('mode').textContent = mode==='duas' ? '2 páginas ✓' : '2 páginas';
 upd();}
const count=document.getElementById('count');
function upd(){const i=pf.getCurrentPageIndex(); const o=pf.getOrientation();
 let label=String(i+1); if(o==='landscape'&&i>0&&i<N-1){label=(i+1)+'–'+Math.min(i+2,N);}
 count.textContent=label+' / '+N;
 document.getElementById('prev').disabled=i===0; document.getElementById('first').disabled=i===0;
 document.getElementById('next').disabled=i>=N-1||(o==='landscape'&&i>=N-2&&i!==0);
 document.querySelectorAll('#thumbs div').forEach((t,k)=>t.classList.toggle('cur',k===i||(o==='landscape'&&k===i+1&&i>0)));
 try{if(location.hash!=='#p'+(i+1)) history.replaceState(null,'','#p'+(i+1));}catch(e){}}
document.getElementById('prev').onclick=()=>pf.flipPrev();
document.getElementById('next').onclick=()=>pf.flipNext();
document.getElementById('last').onclick=()=>{pf.turnToPage(N-1);upd();};
document.getElementById('first').onclick=()=>{pf.turnToPage(0);upd();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')pf.flipNext(); if(e.key==='ArrowLeft')pf.flipPrev();});
const th=document.getElementById('thumbs');
for(let i=1;i<=N;i++){const t=document.createElement('div');
 t.innerHTML=`<img src="pages/p-${String(i).padStart(2,'0')}.jpg" loading="lazy" alt="">${String(i).padStart(2,'0')}`;
 t.onclick=()=>{pf.turnToPage(i-1);upd();th.classList.remove('on');};th.appendChild(t);}
document.getElementById('grid').onclick=()=>{th.classList.toggle('on');const c=th.querySelector('.cur');if(c)c.scrollIntoView({inline:'center',block:'nearest'});};
document.getElementById('fs').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){}};
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>build(pf.getCurrentPageIndex()),250);});
document.getElementById('mode').onclick=()=>{mode = mode==='duas' ? 'auto' : 'duas';
 try{localStorage.setItem('bidMode',mode);}catch(e){} build(pf.getCurrentPageIndex());};
const m=/^#p(\d+)$/.exec(location.hash); build(m?Math.min(N,Math.max(1,+m[1]))-1:0); setTimeout(()=>document.getElementById('hint').style.opacity=0,4000);
</script></body></html>
